<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>全港巴士實時雷達 & 沿線導航</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 點陣地圖背景，扮原生 App 質感 */
    body {
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      touch-action: pan-x pan-y;
      overscroll-behavior-y: none;
    }
    button, input { touch-action: manipulation; }
    .custom-scrollbar::-webkit-scrollbar { width: 0px; height: 0px; }
    @keyframes ping-slow {
      0% { transform: scale(1); opacity: 0.8; }
      70%, 100% { transform: scale(2.2); opacity: 0; }
    }
    .animate-ping-slow { animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>
</head>
<body class="text-slate-800 min-h-screen select-none font-sans overflow-hidden">

  <!-- 頂部：專巴動態島 (Dynamic Island) -->
  <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-2.5 rounded-3xl shadow-2xl flex items-center gap-4 backdrop-blur-md border border-slate-700/50 w-11/12 max-w-sm justify-between">
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-1.5">
        <span class="text-sm">🏡</span>
        <span class="text-xs font-black tracking-wide">居民專巴</span>
      </div>
      <div class="flex bg-black/40 p-0.5 rounded-md text-[10px] font-bold">
        <button id="btn-sch-weekday" class="px-1.5 py-0.5 rounded transition">平日</button>
        <button id="btn-sch-holiday" class="px-1.5 py-0.5 rounded transition">假日</button>
      </div>
    </div>
    <div class="flex flex-col items-end">
      <!-- 隱藏但保留畀 JS 讀取 -->
      <div id="shuttle-next-time" class="hidden">--:--</div> 
      <div id="shuttle-countdown" class="text-emerald-400 font-black text-xl leading-none tracking-tight">--:--</div>
      <div id="shuttle-note" class="text-[10px] text-slate-300 mt-0.5 font-bold">計算中...</div>
    </div>
  </div>

  <!-- 頂部右上角：更新提示 -->
  <div id="refresh-badge" class="fixed top-20 right-4 z-40 text-[10px] bg-slate-800/80 backdrop-blur border border-slate-700 px-2 py-1 rounded-full text-slate-300 hidden font-bold shadow-lg">
    <span id="timer-sec">30</span>s 更新
  </div>

  <!-- 底部抽屜 (Bottom Sheet) -->
  <div id="bottom-sheet" class="fixed bottom-0 left-0 w-full bg-white rounded-t-[32px] shadow-[0_-10px_40px_rgba(0,0,0,0.12)] z-40 flex flex-col h-[85vh]"> 
    
    <!-- 頂部拉桿 -->
    <div class="w-full flex justify-center py-3.5 touch-none shrink-0">
      <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
    </div>

    <!-- 功能切換 Tab -->
    <div class="px-5 shrink-0 mb-3">
      <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-black">
        <button id="tab-route" class="flex-1 py-2.5 rounded-lg transition bg-white text-slate-800 shadow-sm flex items-center justify-center gap-1.5">
          <span>🚌</span> 查路線
        </button>
        <button id="tab-plan" class="flex-1 py-2.5 rounded-lg transition text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5">
          <span>📍</span> 去邊度
        </button>
      </div>
    </div>

    <!-- 模式 1: 純路線搜尋 -->
    <div id="panel-route" class="px-5 pb-3 border-b border-slate-100 shrink-0 relative">
      <div class="flex gap-2 items-center">
        <input type="text" id="route-input" placeholder="輸入路線 (例: 268B, 69M)" 
               inputmode="text" autocapitalize="characters" autocomplete="off"
               class="flex-1 px-4 py-3.5 rounded-2xl border border-slate-200 font-black text-lg uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50 focus:bg-white min-w-0" />
        
        <!-- 隱藏舊掣，但留畀 JS 備用 -->
        <button id="btn-quick-reverse" class="hidden">⇆</button>

        <button id="btn-search-single-route" class="bg-blue-600 active:scale-95 text-white font-black px-5 py-3.5 rounded-2xl shadow-sm shrink-0">
          搵車
        </button>
      </div>
      <!-- 自動建議 Box (向上彈出) -->
      <div id="route-suggest-box" class="absolute bottom-full left-5 right-5 mb-2 bg-white rounded-2xl shadow-2xl border border-slate-200 max-h-60 overflow-y-auto hidden z-50 divide-y divide-slate-100"></div>
    </div>

    <!-- 模式 2: 點對點目的地搜尋 -->
    <div id="panel-plan" class="hidden px-5 pb-3 border-b border-slate-100 shrink-0 relative flex-col gap-2.5">
      <div class="flex items-center justify-between text-xs bg-slate-50 p-2 rounded-xl border border-slate-100">
        <div class="flex items-center gap-1.5 min-w-0 font-bold">
          <span id="gps-dot" class="w-2 h-2 rounded-full bg-slate-300 shrink-0"></span>
          <span id="gps-status-text" class="text-slate-600 truncate">未獲取定位</span>
        </div>
        <button id="btn-re-gps" class="text-blue-600 font-bold shrink-0">重新定位</button>
      </div>
      
      <div id="fallback-loc-bar" class="hidden flex items-center gap-1.5 text-[10px] text-slate-500 overflow-x-auto custom-scrollbar pb-1">
        <span class="shrink-0">手動設定:</span>
        <button class="btn-set-loc px-2 py-1 bg-white border rounded shadow-sm font-bold shrink-0" data-lat="22.3175" data-lng="114.1601" data-name="奧運站">奧運站</button>
        <button class="btn-set-loc px-2 py-1 bg-white border rounded shadow-sm font-bold shrink-0" data-lat="22.3193" data-lng="114.1694" data-name="旺角">旺角</button>
        <button class="btn-set-loc px-2 py-1 bg-white border rounded shadow-sm font-bold shrink-0" data-lat="22.3423" data-lng="114.1932" data-name="黃大仙">黃大仙</button>
      </div>

      <div class="flex items-center border border-slate-300 rounded-2xl px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500 focus-within:bg-white">
        <span class="text-sm font-black text-rose-500 mr-2 shrink-0">📍 目的地</span>
        <input type="text" id="input-dest" value="" class="w-full bg-transparent font-black text-base focus:outline-none placeholder-slate-400" placeholder="例: TSW, MK, 觀塘" autocomplete="off" />
      </div>
      <div id="dest-suggest-box" class="absolute bottom-full left-5 right-5 mb-2 bg-white rounded-2xl shadow-2xl border border-slate-200 max-h-48 overflow-y-auto hidden z-50 divide-y divide-slate-100"></div>

      <div id="matched-routes-bar" class="hidden space-y-2 pt-1">
        <div class="flex justify-between items-center text-xs font-bold text-slate-400">
          <span>推薦直達路線:</span>
          <div class="flex gap-1.5">
            <button id="btn-scroll-left" class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-200 text-slate-600">‹</button>
            <button id="btn-scroll-right" class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-200 text-slate-600">›</button>
          </div>
        </div>
        <div id="matched-routes-chips" class="flex gap-2 overflow-x-auto custom-scrollbar pb-1 scroll-smooth"></div>
      </div>
    </div>

    <!-- 方向切換面板 (嵌入至 Timeline 頂部) -->
    <div id="dir-panel" class="hidden shrink-0 px-5 pt-3 pb-1 border-b border-slate-50 shadow-sm z-10 bg-white">
      <div id="dir-buttons" class="flex gap-2"></div>
    </div>

    <div id="status-bar" class="text-[10px] text-slate-400 text-center font-bold py-1.5 shrink-0 bg-slate-50/50">查路線，開始導航</div>

    <!-- 路線軸展示區 -->
    <div id="timeline-container" class="flex-1 overflow-y-auto px-5 pt-4 pb-24 relative bg-white touch-pan-y">
      <div class="text-center text-slate-400 mt-12 space-y-3">
        <div class="text-4xl">👇</div>
        <div class="text-sm font-black text-slate-600">輸入路線號碼開始</div>
        <div class="inline-block bg-slate-100 px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500">
          💡 貼士：喺路線度左右滑動 (Swipe) 可切換方向
        </div>
      </div>
    </div>

  </div>

  <script>

      "17:00", "17:07", "17:15", "17:22", "17:30", "17:37", "17:45", "17:52",
      "18:00", "18:07", "18:15", "18:22", "18:30", "18:37", "18:45", "18:52",
      "19:00", "19:07", "19:15", "19:22", "19:30", "19:37", "19:45", "19:52",

      "23:00", "23:07", "23:15", "23:22", "23:30", "23:37", "23:45", "23:52",
      "24:00"
    ];

    const todayDay = new Date().getDay();
    let isHolidayMode = (todayDay === 0 || todayDay === 6);
    const btnWeekday = document.getElementById('btn-sch-weekday');
    const btnHoliday = document.getElementById('btn-sch-holiday');

    function syncScheduleToggleUI() {
      if (isHolidayMode) {
        btnHoliday.className = 'px-1.5 py-0.5 rounded transition bg-white text-slate-900 shadow-sm';
        btnWeekday.className = 'px-1.5 py-0.5 rounded transition text-white/70 hover:text-white';
      } else {
        btnWeekday.className = 'px-1.5 py-0.5 rounded transition bg-white text-slate-900 shadow-sm';
        btnHoliday.className = 'px-1.5 py-0.5 rounded transition text-white/70 hover:text-white';
      }
    }
    btnWeekday.onclick = () => { isHolidayMode = false; syncScheduleToggleUI(); updateShuttleWidget(); };
    btnHoliday.onclick = () => { isHolidayMode = true; syncScheduleToggleUI(); updateShuttleWidget(); };
    syncScheduleToggleUI();

    function updateShuttleWidget() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const currentSeconds = now.getSeconds();
      const activeSchedule = isHolidayMode ? SCHEDULE_HOLIDAY : SCHEDULE_WEEKDAY;
      let upcoming = [];

      for (let rawItem of activeSchedule) {
        const isSkipMTR = rawItem.includes('#');
        const isViaBlock2 = rawItem.includes('◆');
        const cleanTime = rawItem.replace('#', '').replace('◆', '');
        let [h, m] = cleanTime.split(':').map(Number);
        const totalMin = h * 60 + m;

        if (totalMin >= currentMinutes) {
          const diffSec = (totalMin - currentMinutes) * 60 - currentSeconds;
          if (diffSec >= 0) {
            upcoming.push({ time: cleanTime === '24:00' ? '00:00' : cleanTime, diffSec, isSkipMTR, isViaBlock2 });
          }
        }
      }

      const countdownEl = document.getElementById('shuttle-countdown');
      const noteEl = document.getElementById('shuttle-note');

      if (!upcoming.length) {
        countdownEl.textContent = '已完結';
        countdownEl.className = 'text-xl font-black text-slate-400';
        noteEl.textContent = '尾班已過';
        return;
      }

      const first = upcoming[0];
      const minLeft = Math.floor(first.diffSec / 60);
      const secLeft = first.diffSec % 60;

      let tagStr = '';
      if (first.isSkipMTR) tagStr = '<span class="text-rose-300">特別車</span>';
      else if (first.isViaBlock2) tagStr = '<span class="text-amber-300">經分站</span>';
      else tagStr = '<span class="text-emerald-100">正常</span>';
      
      noteEl.innerHTML = `${first.time} | ${tagStr}`;

      if (minLeft <= 0) {
        countdownEl.textContent = `${secLeft}s 開出`;
        countdownEl.className = 'text-xl font-black text-rose-400 animate-pulse';
      } else {
        countdownEl.textContent = `${minLeft}分 ${secLeft}秒`;
        countdownEl.className = 'text-xl font-black text-emerald-400';
      }
    }
    setInterval(updateShuttleWidget, 1000);
    updateShuttleWidget();

    // ==================== 2. 全港巴士字典及 API ====================
    const MTR_STOP_NAME_DICT = {
      "K73-D010": "天恒邨總站", "K73-D020": "天晴邨晴碧樓", "K73-D030": "天逸邨逸海樓",
      "K73-D040": "天富苑欣富閣", "K73-D050": "天頌苑天澤閣", "K73-D070": "天水圍市中心",
      "K73-D080": "景湖居", "K73-D090": "麗湖居", "K73-D100": "天頌苑",
      "K73-D110": "天瑞邨", "K73-D120": "天水圍公園", "K73-D130": "天慈邨",
      "K73-D140": "鳳池村", "K73-D150": "元朗廣場", "K73-D160": "元朗安寧路", "K73-D170": "元朗(西)總站",
      "K73-U010": "元朗(西)總站", "K73-U020": "安信街", "K73-U030": "喜利大廈",
      "K73-U040": "元朗盲人安老院", "K73-U050": "水邊村", "K73-U060": "鳳池村",
      "K73-U070": "天慈邨", "K73-U080": "天水圍公園", "K73-U090": "天瑞邨",

    };

    const MTR_BUS_ROUTES = [
      { route: "K73", orig: "天恒", dest: "元朗(西)", co: "MTR" },
      { route: "K74", orig: "天水圍市中心", dest: "凹頭", co: "MTR" },
      { route: "K65", orig: "元朗站", dest: "流浮山", co: "MTR" }
    ];

    const PLACE_SHORTFORMS = {
      "YL": "元朗", "TSW": "天水圍", "TM": "屯門", "MK": "旺角", "CWB": "銅鑼灣",
      "WTS": "黃大仙", "KT": "觀塘", "TST": "尖沙咀", "OLY": "奧運"
    };

    function normalizePlace(text) {
      if (!text) return '';
      const upper = text.trim().toUpperCase();
      return PLACE_SHORTFORMS[upper] || text.trim();
    }

    const CORRIDOR_INDEX = {
      "天水圍": ["265B", "269B", "269C", "69X", "69M", "969", "E37"],
      "元朗": ["268C", "268B", "68M", "68X", "968", "E36"],

    };

    // 🔴 套用咗你專屬嘅 Cloudflare Worker
    const WORKER_URL = 'https://hk-bus-cachedeploy.kachai2008.workers.dev/?url=';
    const API_KMB_ROUTES = WORKER_URL + encodeURIComponent('https://data.etabus.gov.hk/v1/transport/kmb/route/');
    const API_CTB_ROUTES = WORKER_URL + encodeURIComponent('https://rt.data.gov.hk/v2/transport/citybus/route/CTB');

    // 以下查秒數 API 唔經 Worker，保證實時
    const API_KMB_ROUTE_STOP = 'https://data.etabus.gov.hk/v1/transport/kmb/route-stop';
    const API_KMB_ETA_ROUTE_STOP = 'https://data.etabus.gov.hk/v1/transport/kmb/eta';
    const API_CTB_ROUTE_STOP = 'https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB';
    const API_CTB_STOP = 'https://rt.data.gov.hk/v2/transport/citybus/stop/';
    const API_CTB_ETA = 'https://rt.data.gov.hk/v2/transport/citybus/eta/CTB';

    const tabRoute = document.getElementById('tab-route');
    const tabPlan = document.getElementById('tab-plan');
    const panelRoute = document.getElementById('panel-route');
    const panelPlan = document.getElementById('panel-plan');

    let allRoutesCatalog = [];
    const globalStopMap = new Map();

    // --- Tab 切換 ---

      tabRoute.className = 'flex-1 py-2.5 rounded-lg transition text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5';
      panelPlan.classList.remove('hidden');
      panelPlan.classList.add('flex');
      panelRoute.classList.add('hidden');
    };

    async function initSystem() {
      try {
        statusBar.textContent = '⚡ 快取全港巴士庫中...';
        const [kmbR, ctbR, kmbStopsRes] = await Promise.all([
          fetch(API_KMB_ROUTES).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(API_CTB_ROUTES).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(API_KMB_ALL_STOPS).then(r => r.json()).catch(() => ({ data: [] }))
        ]);

        const rMap = new Map();
        MTR_BUS_ROUTES.forEach(r => rMap.set('MTR_' + r.route, r));
        (kmbR.data || []).forEach(r => {
          let orig = r.orig_tc, dest = r.dest_tc;
          if (r.route === '268B') { orig = '朗屏站'; dest = '紅磡 (紅鸞道)'; }
          rMap.set('KMB_' + r.route, { route: r.route, orig, dest, co: 'KMB' });
        });
        (ctbR.data || []).forEach(r => rMap.set('CTB_' + r.route, { route: r.route, orig: r.orig_tc, dest: r.dest_tc, co: 'CTB' }));
        allRoutesCatalog = Array.from(rMap.values());

        (kmbStopsRes.data || []).forEach(s => {
          globalStopMap.set('KMB_' + s.stop, { name: s.name_tc, lat: parseFloat(s.lat), lng: parseFloat(s.long) });
        });
        statusBar.textContent = `✅ 資料庫就緒 (${allRoutesCatalog.length} 條路線)`;
      } catch (e) {
        allRoutesCatalog = MTR_BUS_ROUTES;
        statusBar.textContent = '⚠️ 切換備用模式';
      }
    }

    routeInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toUpperCase();
      if (!q) { routeSuggestBox.classList.add('hidden'); return; }

      const matches = allRoutesCatalog.filter(r => r.route.startsWith(q) || r.route.includes(q)).slice(0, 8);
      routeSuggestBox.innerHTML = '';
      if (!matches.length) { routeSuggestBox.classList.add('hidden'); return; }

      matches.forEach(r => {
        const item = document.createElement('div');
        item.className = 'px-4 py-3 hover:bg-slate-50 cursor-pointer flex justify-between items-center transition';
        const tagClass = r.co === 'MTR' ? 'bg-emerald-100 text-emerald-800' : (r.co === 'CTB' ? 'bg-amber-100 text-amber-800' : 'bg-red-50 text-red-600');
        item.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="font-black text-lg text-slate-900">${r.route}</span>
            <span class="text-[10px] ${tagClass} px-1.5 py-0.5 rounded font-black shrink-0">${r.co}</span>
            <span class="text-slate-500 font-bold truncate text-sm">${r.orig} ➔ ${r.dest}</span>
          </div>
        `;
        item.onclick = () => {
          routeInput.value = r.route;
          routeSuggestBox.classList.add('hidden');
          loadRouteFullTimeline(r.route, r.co);
        };
        routeSuggestBox.appendChild(item);
      });
      routeSuggestBox.classList.remove('hidden');
    });

    btnSearchSingleRoute.onclick = () => {
      const r = routeInput.value.trim().toUpperCase();
      if (!r) return;
      routeSuggestBox.classList.add('hidden');
      const found = allRoutesCatalog.find(item => item.route === r);
      loadRouteFullTimeline(r, found ? found.co : 'KMB');
    };

    // --- 核心載入時間軸 (沿用你嘅邏輯) ---
    async function loadRouteFullTimeline(route, company = 'KMB', preferredDir = null) {
      currentRoute = route;
      currentCompany = company;
      statusBar.textContent = `⚡ 載入 ${route} 站點...`;
      timelineContainer.innerHTML = '<div class="text-center text-slate-400 py-10"><div class="inline-block animate-spin mr-1">⏳</div> 載入中...</div>';
      
      dirPanel.classList.add('hidden');
      clearInterval(refreshInterval);
      refreshBadge.classList.add('hidden');

      if (company === 'MTR' || route.startsWith('K') || route === '506') {
        currentCompany = 'MTR';
        loadMTRBusTimeline(route);
        return;
      }

      let apiDir1 = route === '268B' ? '2' : '1';
      let apiDir2 = route === '268B' ? '1' : '2';

      const [kmbOut, kmbIn, ctbOut, ctbIn] = await Promise.all([
        fetch(`${API_KMB_ROUTE_STOP}/${route}/${apiDir1}/1`).then(r => r.json()).catch(() => ({})),
        fetch(`${API_KMB_ROUTE_STOP}/${route}/${apiDir2}/1`).then(r => r.json()).catch(() => ({})),
        fetch(`${API_CTB_ROUTE_STOP}/${route}/outbound`).then(r => r.json()).catch(() => ({})),
        fetch(`${API_CTB_ROUTE_STOP}/${route}/inbound`).then(r => r.json()).catch(() => ({}))
      ]);

      availableDirs = [];
      if (company === 'KMB') {
        if (kmbOut.data?.length) availableDirs.push('outbound');
        if (kmbIn.data?.length) availableDirs.push('inbound');
      } else {
        if (ctbOut.data?.length) availableDirs.push('outbound');
        if (ctbIn.data?.length) availableDirs.push('inbound');
      }

      if (!availableDirs.length) {
        timelineContainer.innerHTML = '<div class="text-center text-rose-500 font-bold py-10">⚠️ 未能取得該路線資料</div>';
        return;
      }
      currentDir = (preferredDir && availableDirs.includes(preferredDir)) ? preferredDir : availableDirs[0];

      renderDirButtons();
      renderTimelineFast(null);
    }

    async function loadMTRBusTimeline(route) {
      try {
        const res = await fetch(API_MTR_BUS_ETA, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: "zh", routeName: route })
        });
        const data = await res.json();
        if (!data.busStop || !data.busStop.length) {
          timelineContainer.innerHTML = '<div class="text-center text-slate-400 py-10">暫無班次或已過尾班車</div>';
          return;
        }
        mtrBusStopsCache = data.busStop;
        currentDir = 'outbound';
        renderMTRBusUI(route, mtrBusStopsCache);
      } catch (e) { timelineContainer.innerHTML = ''; }
    }

    function renderMTRBusUI(route, stops) {
      statusBar.textContent = `🎯 港鐵巴士 ${route} (${currentDir === 'outbound' ? '去程' : '回程'})`;
      let html = `<div class="space-y-4">`;
      stops.forEach((stop, idx) => {
        const buses = stop.bus || [];
        const stopName = MTR_STOP_NAME_DICT[stop.busStopId] || stop.busStopId;
        let etaStr = '<span class="text-[10px] text-slate-400">暫無下班車</span>';
        if (buses.length) {
          etaStr = buses.slice(0, 2).map(b => {
            const min = Math.ceil(parseInt(b.departureTimeInSecond) / 60);
            return `<span class="inline-block mr-2 px-2 py-0.5 rounded text-xs font-black ${min <= 3 ? 'bg-rose-600 text-white animate-pulse' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'}">🚍 ${min <= 1 ? '即將開出' : min + ' 分鐘'}</span>`;
          }).join('');
        }
        html += `
          <div class="flex items-start gap-3 pb-3 border-b border-slate-100 last:border-0">
            <span class="text-xs text-slate-300 font-black mt-0.5 w-5">${idx + 1}</span>
            <div class="flex-1"><div class="text-sm font-black text-slate-800">${stopName}</div><div class="mt-1">${etaStr}</div></div>
          </div>
        `;
      });
      timelineContainer.innerHTML = html + '</div>';
    }

    function renderDirButtons() {
      dirButtons.innerHTML = '';
      dirPanel.classList.remove('hidden');
      const rInfo = allRoutesCatalog.find(i => i.route === currentRoute);
      
      availableDirs.forEach(dir => {
        const btn = document.createElement('button');
        const isActive = dir === currentDir;
        let dirLabel = dir === 'outbound' ? '去程' : '回程';
        if (rInfo) {
          dirLabel = routeInput.value.toUpperCase() === '268B' ? 
            (dir === 'outbound' ? '往 紅磡(紅鸞道)' : '往 朗屏站') : 
            (dir === 'outbound' ? `往 ${rInfo.dest}` : `往 ${rInfo.orig}`);
        }

        btn.className = `flex-1 py-2.5 rounded-xl text-xs font-black transition shadow-sm ${
          isActive ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
        }`;
        btn.innerHTML = `${isActive ? '✓ ' : ''}${dirLabel}`;
        btn.onclick = () => {
          if (currentDir === dir) return;
          currentDir = dir;
          renderDirButtons();
          renderTimelineFast();
        };
        dirButtons.appendChild(btn);
      });
    }

    async function renderTimelineFast(pos = null) {
      let apiSeqDir = currentRoute !== '268B' ? (currentDir === 'outbound' ? '1' : '2') : (currentDir === 'outbound' ? '2' : '1');
      let rawStops = [];
      
      if (currentCompany === 'KMB') {
        const res = await fetch(`${API_KMB_ROUTE_STOP}/${currentRoute}/${apiSeqDir}/1`).then(r => r.json());
        rawStops = res.data || [];
      } else {
        const res = await fetch(`${API_CTB_ROUTE_STOP}/${currentRoute}/${currentDir}`).then(r => r.json());
        rawStops = res.data || [];
      }

      allRouteStops = await Promise.all(rawStops.map(async (s) => {
        const key = currentCompany + '_' + s.stop;
        if (globalStopMap.has(key)) return { seq: s.seq, stopId: s.stop, ...globalStopMap.get(key) };
        const api = currentCompany === 'KMB' ? `${API_KMB_ALL_STOPS}/${s.stop}` : `${API_CTB_STOP}${s.stop}`;
        const sRes = await fetch(api).then(r => r.json()).catch(() => ({}));
        const obj = { name: sRes.data?.name_tc || '未知分站', lat: parseFloat(sRes.data?.lat || 0), lng: parseFloat(sRes.data?.long || 0) };
        globalStopMap.set(key, obj);
        return { seq: s.seq, stopId: s.stop, ...obj };
      }));

      statusBar.textContent = `🎯 路線 ${currentRoute} (共 ${allRouteStops.length} 站)`;
      drawTimelineUI();
      refreshUpcomingETAs();
      startAutoRefresh();
    }

    function drawTimelineUI() {
      let htmlBuffer = `<div class="relative space-y-0 pl-2 mt-2">`;
      allRouteStops.forEach((stop, idx) => {
        const isLast = idx === allRouteStops.length - 1;
        htmlBuffer += `
          <div class="flex items-start gap-4 relative pb-5" id="stop-node-${idx}">
            ${!isLast ? `<div class="absolute left-[7px] top-4 bottom-0 w-[2px] bg-slate-200"></div>` : ''}
            <div class="relative z-10 w-4 h-4 mt-1 bg-white border-4 border-slate-300 rounded-full shadow-sm shrink-0"></div>
            <div class="flex-1 min-w-0 -mt-0.5">
              <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-400 font-bold w-4">${stop.seq}</span>
                <span class="text-[15px] font-black text-slate-800">${stop.name}</span>
              </div>
              <div id="tl-eta-${stop.stopId}" class="mt-1 space-y-1"><span class="text-[11px] text-slate-400">載入實時班次中...</span></div>
            </div>
          </div>
        `;
      });
      timelineContainer.innerHTML = htmlBuffer + '</div>';
    }

    function refreshUpcomingETAs() {
      // 簡單起見，直接查頭幾站 (因為無 GPS 快取)
      const activeTargets = allRouteStops.slice(0, 10); 
      activeTargets.forEach(stop => {
        const etaBox = document.getElementById(`tl-eta-${stop.stopId}`);
        if (!etaBox) return;

        if (currentCompany === 'KMB') {
          fetch(`${API_KMB_ETA_ROUTE_STOP}/${stop.stopId}/${currentRoute}/1`)
            .then(r => r.json())
            .then(json => {
              let expectedDir = currentRoute !== '268B' ? (currentDir === 'outbound' ? '1' : '2') : (currentDir === 'outbound' ? '2' : '1');
              let etas = (json.data || []).filter(item => item.route === currentRoute && (!item.dir || item.dir === expectedDir) && (!item.service_type || item.service_type === 1));
              renderOfficialETARows(etaBox, etas);
            }).catch(() => { etaBox.innerHTML = '<span class="text-rose-400 text-[10px]">無資料</span>'; });
        } else {
          fetch(`${API_CTB_ETA}/${stop.stopId}/${currentRoute}`)
            .then(r => r.json())
            .then(json => {
              let etas = (json.data || []).filter(e => e.dir === (currentDir === 'outbound' ? 'O' : 'I'));
              renderOfficialETARows(etaBox, etas);
            });
        }
      });
    }

    function renderOfficialETARows(container, etas) {
      if (!etas || !etas.length) { container.innerHTML = '<span class="text-[10px] text-slate-300">暫無班次數據</span>'; return; }
      const now = new Date();
      container.innerHTML = etas.slice(0, 2).map(item => {
        if (!item.eta) return `<span class="text-[10px] text-slate-300 mr-2">未開出</span>`;
        const minLeft = Math.ceil((new Date(item.eta) - now) / 60000);
        return `<span class="inline-flex items-center gap-1 mr-2 px-2 py-0.5 rounded text-xs font-black ${minLeft <= 3 ? 'bg-rose-600 text-white animate-pulse shadow-md' : 'bg-slate-100 text-slate-700 border border-slate-200'}">🚍 ${minLeft <= 1 ? '即將抵達' : minLeft + ' 分鐘'}</span>`;
      }).join('');
    }

    function startAutoRefresh() {
      clearInterval(refreshInterval);
      countdownSec = 30;
      refreshBadge.classList.remove('hidden');
      timerSec.textContent = countdownSec;
      refreshInterval = setInterval(() => {
        countdownSec--;
        timerSec.textContent = countdownSec;
        if (countdownSec <= 0) { countdownSec = 30; refreshUpcomingETAs(); }
      }, 1000);
    }

    initSystem();

    // ==================== 3. 左右 Swipe 切換方向邏輯 (完美支援手機) ====================
    let touchStartX = 0;
    let touchEndX = 0;

    timelineContainer.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    timelineContainer.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      
      // 滑動距離超過 60px 先計數，避免輕微掂到誤判
      if (Math.abs(swipeDistance) > 60) {
        
        // 如果係港鐵巴士
        if (currentCompany === 'MTR' && mtrBusStopsCache.length) {
          mtrBusStopsCache.reverse();
          currentDir = (currentDir === 'outbound') ? 'inbound' : 'outbound';
          renderMTRBusUI(currentRoute, mtrBusStopsCache);
          if (navigator.vibrate) navigator.vibrate(40);
          return;
        }

        // 如果係九巴城巴，且有雙向
        if (availableDirs.length > 1) {
          if (swipeDistance > 0) {
            // 向右滑 (通常習慣係切換方向)
            currentDir = (currentDir === 'outbound') ? 'inbound' : 'outbound';
          } else {
            // 向左滑
            currentDir = (currentDir === 'inbound') ? 'outbound' : 'inbound';
          }
          renderDirButtons();
          renderTimelineFast();
          // 手機震動回饋 (極具原生 App 手感)
          if (navigator.vibrate) navigator.vibrate(40);
        }
      }
    }
  </script>
</body>
