<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KMB 路線定位 ETA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 防止手機雙擊縮放及優化點擊延遲 */
    button, input { touch-action: manipulation; }
    /* 隱藏滾動條 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16 select-none font-sans">

  <!-- 頂部簡潔 Bar + 自動更新狀態 -->
  <header class="bg-red-600 text-white px-4 py-3 shadow sticky top-0 z-30 flex justify-between items-center">
    <h1 class="text-lg font-black tracking-wide">九巴實時 ETA</h1>
    <div id="refresh-badge" class="text-xs bg-red-700 px-2 py-1 rounded-full text-slate-200 hidden">
      自動更新: <span id="timer-sec">30</span>s
    </div>
  </header>

  <main class="max-w-md mx-auto p-3 space-y-3">
    
    <!-- 搜尋與常用線卡片 -->
    <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
      <div class="flex gap-2">
        <input type="text" id="route-input" placeholder="輸入路線 (例: 98D, 1A)" 
               inputmode="text" autocapitalize="characters"
               class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 font-bold text-lg uppercase focus:ring-2 focus:ring-red-500 focus:outline-none" />
        <button id="btn-search-route" class="bg-red-600 text-white font-bold px-5 py-2.5 rounded-xl active:scale-95 transition text-base">
          搵車
        </button>
      </div>

      <!-- 最近搜尋常用 Chips (單手直覺點擊) -->
      <div id="history-box" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 hidden">
        <span class="text-xs text-slate-400 shrink-0 font-medium">常用:</span>
        <div id="history-chips" class="flex gap-1.5"></div>
      </div>

      <!-- 方向列 + 對調掣 -->
      <div id="dir-panel" class="hidden flex items-center gap-2 pt-1 border-t border-slate-100">
        <div id="dir-buttons" class="flex flex-1 gap-1.5"></div>
        <button id="btn-reverse" title="對調去程/回程" class="bg-slate-100 active:bg-slate-300 text-slate-700 font-bold px-3.5 py-2 rounded-xl text-base border border-slate-300 active:rotate-180 transition-transform flex items-center justify-center">
          ⇆
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar" class="text-xs text-slate-400 text-center font-medium">輸入路線即刻定位最近上車點</div>

    <!-- 列表展示區 -->
    <div id="results" class="space-y-3"></div>

  </main>

  <script>
    const API_ROUTE_STOP = 'https://data.etabus.gov.hk/v1/transport/kmb/route-stop';
    const API_STOP = 'https://data.etabus.gov.hk/v1/transport/kmb/stop/';
    const API_ETA = 'https://data.etabus.gov.hk/v1/transport/kmb/eta';
    const HISTORY_KEY = 'kmb_recent_routes';

    const routeInput = document.getElementById('route-input');
    const btnSearch = document.getElementById('btn-search-route');
    const btnReverse = document.getElementById('btn-reverse');
    const dirPanel = document.getElementById('dir-panel');
    const dirButtons = document.getElementById('dir-buttons');
    const statusBar = document.getElementById('status-bar');
    const results = document.getElementById('results');
    const historyBox = document.getElementById('history-box');
    const historyChips = document.getElementById('history-chips');
    const refreshBadge = document.getElementById('refresh-badge');
    const timerSec = document.getElementById('timer-sec');

    let currentRoute = '';
    let currentDir = 'outbound';
    let availableDirs = [];
    const stopCache = new Map();
    let refreshInterval = null;
    let countdownSec = 30;

    // Haversine 距離 (米)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getUserLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
          () => resolve(null),
          { timeout: 5000, enableHighAccuracy: true }
        );
      });
    }

    // 常用歷史記錄管理
    function loadHistory() {
      const list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      if (!list.length) { historyBox.classList.add('hidden'); return; }
      historyBox.classList.remove('hidden');
      historyChips.innerHTML = '';
      list.forEach(rt => {
        const chip = document.createElement('button');
        chip.className = 'px-2.5 py-1 bg-slate-100 active:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold border border-slate-200';
        chip.textContent = rt;
        chip.onclick = () => {
          routeInput.value = rt;
          searchRoute();
        };
        historyChips.appendChild(chip);
      });
    }

    function saveHistory(rt) {
      let list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      list = [rt, ...list.filter(item => item !== rt)].slice(0, 5);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
      loadHistory();
    }

    // 搜尋路線
    async function searchRoute() {
      const route = routeInput.value.trim().toUpperCase();
      if (!route) return;
      routeInput.blur(); // 手機版核心細節：即收虛擬鍵盤

      currentRoute = route;
      saveHistory(route);
      statusBar.textContent = `🔍 搜尋路線 ${route} 中...`;
      results.innerHTML = '';
      dirPanel.classList.add('hidden');
      dirButtons.innerHTML = '';
      availableDirs = [];
      clearInterval(refreshInterval);
      refreshBadge.classList.add('hidden');

      try {
        const [outRes, inRes] = await Promise.all([
          fetch(`${API_ROUTE_STOP}/${route}/outbound/1`).then(r => r.json()),
          fetch(`${API_ROUTE_STOP}/${route}/inbound/1`).then(r => r.json())
        ]);

        const hasOut = outRes.data && outRes.data.length > 0;
        const hasIn = inRes.data && inRes.data.length > 0;

        if (!hasOut && !hasIn) {
          statusBar.textContent = `❌ 搵唔到路線 ${route}`;
          return;
        }

        if (hasOut) availableDirs.push('outbound');
        if (hasIn) availableDirs.push('inbound');

        dirPanel.classList.remove('hidden');
        currentDir = hasOut ? 'outbound' : 'inbound';
        renderDirButtons();
        loadRouteStops(currentRoute, currentDir);
        startAutoRefresh();

      } catch (e) {
        statusBar.textContent = '❌ 網絡繁忙，請稍後重試';
      }
    }

    function renderDirButtons() {
      dirButtons.innerHTML = '';
      availableDirs.forEach(dir => {
        const btn = document.createElement('button');
        const isActive = dir === currentDir;
        btn.className = `flex-1 py-2 rounded-xl text-xs font-bold transition ${
          isActive ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600 active:bg-slate-200'
        }`;
        btn.textContent = dir === 'outbound' ? '去程' : '回程';
        btn.onclick = () => {
          if (currentDir === dir) return;
          currentDir = dir;
          renderDirButtons();
          loadRouteStops(currentRoute, currentDir);
        };
        dirButtons.appendChild(btn);
      });

      btnReverse.disabled = availableDirs.length <= 1;
      btnReverse.classList.toggle('opacity-30', availableDirs.length <= 1);
    }

    btnReverse.onclick = () => {
      if (availableDirs.length <= 1) return;
      currentDir = (currentDir === 'outbound') ? 'inbound' : 'outbound';
      renderDirButtons();
      loadRouteStops(currentRoute, currentDir);
    };

    let activeStopsToFetch = [];

    async function loadRouteStops(route, direction) {
      statusBar.textContent = '📍 搜尋你身邊最近車站...';
      results.innerHTML = '<div class="text-center text-slate-400 py-10"><div class="inline-block animate-spin mr-1">⏳</div> 計算距離中...</div>';

      const [pos, routeStopsRes] = await Promise.all([
        getUserLocation(),
        fetch(`${API_ROUTE_STOP}/${route}/${direction}/1`).then(r => r.json())
      ]);

      const stopsData = routeStopsRes.data || [];
      if (!stopsData.length) {
        statusBar.textContent = '⚠️ 此方向暫無站位';
        results.innerHTML = '';
        return;
      }

      const stopDetails = await Promise.all(
        stopsData.map(async (s) => {
          if (stopCache.has(s.stop)) {
            return { seq: s.seq, stopId: s.stop, ...stopCache.get(s.stop) };
          }
          const sRes = await fetch(`${API_STOP}${s.stop}`).then(r => r.json());
          const stopObj = {
            name: sRes.data?.name_tc || '未知車站',
            lat: parseFloat(sRes.data?.lat),
            lng: parseFloat(sRes.data?.long)
          };
          stopCache.set(s.stop, stopObj);
          return { seq: s.seq, stopId: s.stop, ...stopObj };
        })
      );

      let processedStops = stopDetails;
      if (pos) {
        processedStops = stopDetails.map(s => ({
          ...s,
          dist: getDistance(pos.lat, pos.lng, s.lat, s.lng)
        })).sort((a, b) => a.dist - b.dist);
        statusBar.textContent = `🎯 路線 ${route}：最近 3 個車站`;
      } else {
        statusBar.textContent = `⚠️ 未獲取 GPS 定位，顯示前 3 個車站`;
      }

      activeStopsToFetch = processedStops.slice(0, 3);
      renderNearbyStops(activeStopsToFetch);
      refreshETAsOnly();
    }

    function renderNearbyStops(stops) {
      results.innerHTML = '';
      stops.forEach(stop => {
        const card = document.createElement('div');
        card.className = 'bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-1.5">
              <span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-bold">第 ${stop.seq} 站</span>
              <h3 class="text-base font-black text-slate-800 tracking-tight">${stop.name}</h3>
            </div>
            ${stop.dist !== undefined ? `<span class="bg-red-50 text-red-600 font-black px-2 py-0.5 rounded-lg text-xs tracking-tight">約 ${Math.round(stop.dist)}m</span>` : ''}
          </div>
          <div id="eta-box-${stop.stopId}" class="text-sm space-y-1.5 pt-2 border-t border-slate-100">
            <span class="text-xs text-slate-400">更新班次中...</span>
          </div>
        `;
        results.appendChild(card);
      });
    }

    // 靜默只更新 ETA 數據 (防止成個畫面閃爍)
    function refreshETAsOnly() {
      activeStopsToFetch.forEach(stop => {
        fetch(`${API_ETA}/${stop.stopId}/${currentRoute}/1`)
          .then(r => r.json())
          .then(json => {
            const etaBox = document.getElementById(`eta-box-${stop.stopId}`);
            if (!etaBox) return;
            const etas = (json.data || []).filter(item => item.route === currentRoute);

            if (!etas.length) {
              etaBox.innerHTML = '<span class="text-xs text-slate-400">暫無班次數據</span>';
              return;
            }

            etaBox.innerHTML = etas.slice(0, 3).map((item, idx) => {
              if (!item.eta) return `<div class="text-xs text-slate-400">第 ${idx + 1} 班: 尾班車已過或未開出</div>`;
              const diffMin = Math.round((new Date(item.eta) - new Date()) / 60000);
              const label = diffMin <= 0 ? '即將抵達' : `${diffMin} 分鐘`;
              const isUrgent = diffMin <= 3;
              return `
                <div class="flex justify-between items-center text-xs py-0.5">
                  <span class="text-slate-600 truncate max-w-[200px]">往 ${item.dest_tc} ${item.rmk_tc ? `<span class="text-slate-400">(${item.rmk_tc})</span>` : ''}</span>
                  <span class="px-2 py-0.5 rounded font-black shrink-0 ${isUrgent ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-100 text-slate-800'}">${label}</span>
                </div>
              `;
            }).join('');
          })
          .catch(() => {});
      });
    }

    // 倒數自動刷新機制 (30s)
    function startAutoRefresh() {
      clearInterval(refreshInterval);
      countdownSec = 30;
      refreshBadge.classList.remove('hidden');
      timerSec.textContent = countdownSec;

      refreshInterval = setInterval(() => {
        countdownSec--;
        timerSec.textContent = countdownSec;
        if (countdownSec <= 0) {
          countdownSec = 30;
          refreshETAsOnly();
        }
      }, 1000);
    }

    btnSearch.onclick = searchRoute;
    routeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchRoute();
    });

    loadHistory();
  </script>
</body>
</html>
