<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>全港巴士實時雷達 & 沿線導航</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    button, input { touch-action: manipulation; }
    .custom-scrollbar::-webkit-scrollbar { height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @keyframes ping-slow {
      0% { transform: scale(1); opacity: 0.8; }
      70%, 100% { transform: scale(2.2); opacity: 0; }
    }
    .animate-ping-slow { animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16 select-none font-sans">

  <!-- 頂部導航 -->
  <header class="bg-slate-900 text-white px-4 md:px-8 py-3 shadow sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-xl">🧭</span>
      <div>
        <h1 class="text-base font-black tracking-wide leading-none">全港巴士實時雷達</h1>
        <span class="text-[10px] text-slate-400">雙向自動判斷 · 智能上車站匹配</span>
      </div>
    </div>
    <div id="refresh-badge" class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-slate-300 hidden">
      更新: <span id="timer-sec">30</span>s
    </div>
  </header>

  <!-- 主佈局 -->
  <main class="w-full max-w-md md:max-w-4xl lg:max-w-5xl mx-auto p-3 md:p-6">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start">

      <!-- 左側操作面板 -->
      <div class="md:col-span-5 lg:col-span-5 space-y-3 md:sticky md:top-20">
        
        <!-- 居民專巴 Widget -->
        <div class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-3.5 rounded-2xl shadow-sm space-y-2">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-1.5">
              <span>🏡</span>
              <h2 class="font-black text-xs tracking-wide">居民專巴</h2>
            </div>
            <div class="flex bg-black/20 p-0.5 rounded-lg text-[10px] font-bold">
              <button id="btn-sch-weekday" class="px-2 py-0.5 rounded transition">平日</button>
              <button id="btn-sch-holiday" class="px-2 py-0.5 rounded transition">假日</button>
            </div>
          </div>
          <div class="flex justify-between items-end">
            <div>
              <div class="text-[10px] text-emerald-100">下班車開出</div>
              <div id="shuttle-next-time" class="text-xl font-black">--:--</div>
            </div>
            <div class="text-right">
              <div id="shuttle-countdown" class="text-2xl font-black text-amber-300">計算中...</div>
              <div id="shuttle-note" class="text-[10px] font-bold"></div>
            </div>
          </div>
        </div>

        <!-- 搜尋主卡片 -->
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3 relative z-40">
          
          <!-- 功能切換 Tab -->
          <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-black">
            <button id="tab-route" class="flex-1 py-2 rounded-lg transition text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1 font-black">
              <span>🚌</span> 查路線號碼
            </button>
            <button id="tab-plan" class="flex-1 py-2 rounded-lg transition bg-white text-slate-800 shadow-sm flex items-center justify-center gap-1 font-black">
              <span>📍</span> 唔知搭咩？去邊度
            </button>
          </div>

          <!-- 模式 1: 純路線搜尋 -->
          <div id="panel-route" class="hidden space-y-2.5">
            <div class="relative">
              <div class="flex gap-1.5 items-center">
                <input type="text" id="route-input" placeholder="輸入路線 (例: 265B, K73, 969)" 
                       inputmode="text" autocapitalize="characters" autocomplete="off"
                       class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 font-black text-base uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50 focus:bg-white min-w-0" />
                
                <button id="btn-quick-reverse" title="掉轉去程/回程方向" 
                        class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-black px-3 py-2.5 rounded-xl text-base border border-slate-300 active:rotate-180 transition-transform duration-200 shrink-0 flex items-center justify-center shadow-sm">
                  ⇆
                </button>

                <button id="btn-search-single-route" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl active:scale-95 transition text-sm shrink-0 shadow-sm">
                  搵車
                </button>
              </div>
              <div id="route-suggest-box" class="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-2xl border border-slate-200 max-h-56 overflow-y-auto hidden z-50 divide-y divide-slate-100"></div>
            </div>
          </div>

          <!-- 模式 2: 點對點目的地搜尋 -->
          <div id="panel-plan" class="space-y-2.5">
            
            <!-- GPS 狀態條與 PC 手動選位 -->
            <div class="flex flex-col gap-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
              <div class="flex items-center justify-between font-bold">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span id="gps-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                  <span id="gps-status-text" class="text-slate-600 truncate">定位中...</span>
                </div>
                <button id="btn-re-gps" class="text-blue-600 hover:underline shrink-0 text-[11px]">重新定位</button>
              </div>
              <!-- PC GPS 失敗時之快捷地點切換 -->
              <div id="fallback-loc-bar" class="hidden flex items-center gap-1 pt-1 border-t border-slate-200/60 text-[10px] text-slate-500">
                <span>快速設為目前位置:</span>
                <button class="btn-set-loc px-1.5 py-0.5 bg-white border rounded font-bold hover:bg-slate-100" data-lat="22.3175" data-lng="114.1601" data-name="奧運站">奧運站</button>
                <button class="btn-set-loc px-1.5 py-0.5 bg-white border rounded font-bold hover:bg-slate-100" data-lat="22.3193" data-lng="114.1694" data-name="旺角">旺角</button>
                <button class="btn-set-loc px-1.5 py-0.5 bg-white border rounded font-bold hover:bg-slate-100" data-lat="22.3423" data-lng="114.1932" data-name="黃大仙">黃大仙</button>
              </div>
            </div>

            <div class="relative">
              <div class="flex items-center border border-slate-300 rounded-xl px-3 py-2 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500 focus-within:bg-white">
                <span class="text-xs font-black text-rose-600 mr-2 shrink-0">🔴 目的地</span>
                <input type="text" id="input-dest" value="TSW"
                       class="w-full bg-transparent font-bold text-sm focus:outline-none" 
                       placeholder="輸入想去邊 (例: TSW, YL, MK, 黃大仙)" autocomplete="off" />
              </div>
              <div id="dest-suggest-box" class="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-2xl border border-slate-200 max-h-48 overflow-y-auto hidden z-50 divide-y divide-slate-100"></div>
            </div>

            <!-- 推薦路線 Chips 區域 -->
            <div id="matched-routes-bar" class="space-y-1.5 pt-1">
              <div class="flex justify-between items-center text-[11px] font-bold text-slate-400">
                <span>直達路線 (智能判斷方向與最近車站):</span>
                <div class="flex gap-1">
                  <button id="btn-scroll-left" class="p-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600">‹</button>
                  <button id="btn-scroll-right" class="p-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-600">›</button>
                </div>
              </div>
              <div id="matched-routes-chips" class="flex gap-2 overflow-x-auto custom-scrollbar pb-2 pt-1 scroll-smooth"></div>
            </div>
          </div>

          <!-- 方向切換面板 -->
          <div id="dir-panel" class="hidden flex items-center gap-2 pt-2 border-t border-slate-100">
            <div id="dir-buttons" class="flex flex-1 gap-1.5"></div>
          </div>

        </div>

        <div id="status-bar" class="text-xs text-slate-400 text-center font-medium py-1">系統準備中...</div>

      </div>

      <!-- 右側路線軸展示區 -->
      <div class="md:col-span-7 lg:col-span-7 space-y-3">
        <div id="timeline-container" class="space-y-3 relative z-10">
          <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400">
            請在左側輸入或選取路線
          </div>
        </div>
      </div>

    </div>
  </main>

    ];

    const todayDay = new Date().getDay();
    let isHolidayMode = (todayDay === 0 || todayDay === 6);
    const btnWeekday = document.getElementById('btn-sch-weekday');
    const btnHoliday = document.getElementById('btn-sch-holiday');

    function syncScheduleToggleUI() {
      if (isHolidayMode) {
        btnHoliday.className = 'px-2 py-0.5 rounded transition bg-white text-emerald-800 shadow-sm';
        btnWeekday.className = 'px-2 py-0.5 rounded transition text-white/80 hover:text-white';
      } else {
        btnWeekday.className = 'px-2 py-0.5 rounded transition bg-white text-emerald-800 shadow-sm';
        btnHoliday.className = 'px-2 py-0.5 rounded transition text-white/80 hover:text-white';
      }
    }
    btnWeekday.onclick = () => { isHolidayMode = false; syncScheduleToggleUI(); updateShuttleWidget(); };
    btnHoliday.onclick = () => { isHolidayMode = true; syncScheduleToggleUI(); updateShuttleWidget(); };
    syncScheduleToggleUI();

    function updateShuttleWidget() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const currentSeconds = now.getSeconds();
      const activeSchedule = isHolidayMode ? SCHEDULE_HOLIDAY : SCHEDULE_WEEKDAY;
      let upcoming = [];

      for (let rawItem of activeSchedule) {
        const isSkipMTR = rawItem.includes('#');
        const isViaBlock2 = rawItem.includes('◆');
        const cleanTime = rawItem.replace('#', '').replace('◆', '');
        let [h, m] = cleanTime.split(':').map(Number);
        const totalMin = h * 60 + m;

        if (totalMin >= currentMinutes) {
          const diffSec = (totalMin - currentMinutes) * 60 - currentSeconds;
          if (diffSec >= 0) {
            upcoming.push({ time: cleanTime === '24:00' ? '00:00' : cleanTime, diffSec, isSkipMTR, isViaBlock2 });
          }
        }
      }

      const nextTimeEl = document.getElementById('shuttle-next-time');
      const countdownEl = document.getElementById('shuttle-countdown');
      const noteEl = document.getElementById('shuttle-note');

      if (!upcoming.length) {
        nextTimeEl.textContent = '今日服務已完結';
        countdownEl.textContent = '尾班已過';
        countdownEl.className = 'text-xl font-black text-slate-300';
        noteEl.textContent = '';
        return;
      }

      const first = upcoming[0];
      const minLeft = Math.floor(first.diffSec / 60);
      const secLeft = first.diffSec % 60;

      nextTimeEl.textContent = first.time;
      if (first.isSkipMTR) noteEl.innerHTML = '<span class="text-rose-200 bg-rose-900/60 px-1.5 py-0.5 rounded">特別班次</span>';
      else if (first.isViaBlock2) noteEl.innerHTML = '<span class="text-amber-200">經分站</span>';
      else noteEl.innerHTML = '<span class="text-emerald-100">正常班次</span>';

      if (minLeft <= 0) {
        countdownEl.textContent = `${secLeft}s 開出`;
        countdownEl.className = 'text-xl font-black text-rose-300 animate-pulse';
      } else {
        countdownEl.textContent = `${minLeft}分 ${secLeft}秒`;
        countdownEl.className = 'text-2xl font-black text-amber-300';
      }
    }
    setInterval(updateShuttleWidget, 1000);
    updateShuttleWidget();

    // ==================== 2. 香港地名 Short Form 字典 ====================
    const PLACE_SHORTFORMS = {
      "YL": "元朗", "YUEN LONG": "元朗",
      "TSW": "天水圍", "TIN SHUI WAI": "天水圍",
      "TM": "屯門", "TUEN MUN": "屯門",
      "MK": "旺角", "MONG KOK": "旺角",

    function normalizePlace(text) {
      if (!text) return '';
      const upper = text.trim().toUpperCase();
      return PLACE_SHORTFORMS[upper] || text.trim();
    }

    const CORRIDOR_INDEX = {

    let allRoutesCatalog = [];

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ==================== 核心：強健 GPS 獲取與 PC Fallback ====================
    function ensureUserLocation(force = false) {
      if (cachedUserPos && !force) return Promise.resolve(cachedUserPos);

      gpsStatusText.textContent = '獲取真實 GPS 定位中...';
      gpsDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
      fallbackLocBar.classList.add('hidden');

      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          handleGpsFailure('瀏覽器不支援定位');
          return resolve(null);
        }

        navigator.geolocation.getCurrentPosition(
          p => {
            cachedUserPos = { lat: p.coords.latitude, lng: p.coords.longitude };
            gpsStatusText.textContent = `📍 已定位 (${cachedUserPos.lat.toFixed(3)}, ${cachedUserPos.lng.toFixed(3)})`;
            gpsDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
            fallbackLocBar.classList.add('hidden');
            resolve(cachedUserPos);
          },
          (err) => {
            handleGpsFailure('無法獲取定位 (可點下方手動設定)');
            resolve(cachedUserPos); // 若手動設過則回傳手動座標
          },
          { timeout: 6000, enableHighAccuracy: true }
        );
      });
    }

    function handleGpsFailure(msg) {
      gpsStatusText.textContent = msg;
      gpsDot.className = 'w-2 h-2 rounded-full bg-rose-500';
      fallbackLocBar.classList.remove('hidden');
    }

    // 手動地點設定 (解決 Windows PC 沒 GPS 問題)
    document.querySelectorAll('.btn-set-loc').forEach(btn => {
      btn.onclick = () => {
        const lat = parseFloat(btn.dataset.lat);
        const lng = parseFloat(btn.dataset.lng);
        const name = btn.dataset.name;
        cachedUserPos = { lat, lng };
        gpsStatusText.textContent = `📍 已手動設定身處：${name}`;
        gpsDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        triggerDestSearch(inputDest.value);
      };
    });

    btnReGps.onclick = async () => {
      await ensureUserLocation(true);
      triggerDestSearch(inputDest.value);
    };

    tabRoute.onclick = () => {
      tabRoute.className = 'flex-1 py-2 rounded-lg transition bg-white text-slate-800 shadow-sm flex items-center justify-center gap-1 font-black';
      tabPlan.className = 'flex-1 py-2 rounded-lg transition text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1 font-black';
      panelRoute.classList.remove('hidden');
      panelPlan.classList.add('hidden');
    };

    tabPlan.onclick = async () => {
      tabPlan.className = 'flex-1 py-2 rounded-lg transition bg-white text-slate-800 shadow-sm flex items-center justify-center gap-1 font-black';
      tabRoute.className = 'flex-1 py-2 rounded-lg transition text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1 font-black';
      panelPlan.classList.remove('hidden');
      panelRoute.classList.add('hidden');

      await ensureUserLocation();
      triggerDestSearch(inputDest.value);
    };

    btnScrollLeft.onclick = () => { matchedRoutesChips.scrollBy({ left: -200, behavior: 'smooth' }); };
    btnScrollRight.onclick = () => { matchedRoutesChips.scrollBy({ left: 200, behavior: 'smooth' }); };
    matchedRoutesChips.addEventListener('wheel', (e) => {
      e.preventDefault();
      matchedRoutesChips.scrollLeft += e.deltaY;
    });

    async function initSystem() {
      try {
        statusBar.textContent = '⚡ 載入全港路線與車站資料庫...';
        const [kmbR, ctbR, kmbStopsRes] = await Promise.all([
          fetch(API_KMB_ROUTES).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(API_CTB_ROUTES).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(API_KMB_ALL_STOPS).then(r => r.json()).catch(() => ({ data: [] }))
        ]);

        const rMap = new Map();
        (kmbR.data || []).forEach(r => rMap.set('KMB_' + r.route, { route: r.route, orig: r.orig_tc, dest: r.dest_tc, co: 'KMB' }));
        (ctbR.data || []).forEach(r => rMap.set('CTB_' + r.route, { route: r.route, orig: r.orig_tc, dest: r.dest_tc, co: 'CTB' }));
        allRoutesCatalog = Array.from(rMap.values());

        (kmbStopsRes.data || []).forEach(s => {
          globalStopMap.set('KMB_' + s.stop, {
            name: s.name_tc,
            lat: parseFloat(s.lat),
            lng: parseFloat(s.long)
          });
        });

        statusBar.textContent = `✅ 資料庫就緒 (${allRoutesCatalog.length} 條路線)`;
        
        await ensureUserLocation();
        triggerDestSearch('TSW');
      } catch (e) {
        statusBar.textContent = '⚠️ 初始化切換備用模式';
      }
    }

    // ==================== 核心：雙向自動分析 (Auto-Direction & Nearest Spot) ====================
    async function triggerDestSearch(rawInput) {
      const dest = normalizePlace(rawInput);
      if (!dest) return;

      statusBar.textContent = `📍 正在比對離你最近的前往「${dest}」路線與方向...`;
      matchedRoutesChips.innerHTML = '<span class="text-xs text-slate-400 py-1">計算最近車站與方向中...</span>';

      const pos = await ensureUserLocation();

      // 1. 檢索直達目的地的候選路線
      let candidates = new Set();
      Object.keys(CORRIDOR_INDEX).forEach(place => {
        if (dest.includes(place) || place.includes(dest)) {
          CORRIDOR_INDEX[place].forEach(rt => candidates.add(rt));
        }
      });
      allRoutesCatalog.forEach(r => {
        if (r.dest.includes(dest)) candidates.add(r.route);
      });

      const candidateList = Array.from(candidates);

      // 2. 核心比對：同時比對去程與回程，挑選「目的地吻合 + 車站離你最近」的方向
      let scoredRoutes = [];

      if (pos) {
        scoredRoutes = await Promise.all(
          candidateList.map(async (rt) => {
            const rObj = allRoutesCatalog.find(i => i.route === rt) || { route: rt, co: 'KMB' };
            try {
              const [outRes, inRes] = await Promise.all([
                fetch(`${API_KMB_ROUTE_STOP}/${rt}/outbound/1`).then(r => r.json()).catch(() => ({})),
                fetch(`${API_KMB_ROUTE_STOP}/${rt}/inbound/1`).then(r => r.json()).catch(() => ({}))
              ]);

              const outStops = outRes.data || [];
              const inStops = inRes.data || [];

              // 計算去程沿線最短距離
              let outMinDist = Infinity;
              let outNearestStop = null;
              outStops.forEach(s => {
                const sData = globalStopMap.get('KMB_' + s.stop);
                if (sData) {
                  const d = getDistance(pos.lat, pos.lng, sData.lat, sData.lng);
                  if (d < outMinDist) {
                    outMinDist = d;
                    outNearestStop = { seq: s.seq, stopId: s.stop, ...sData };
                  }
                }
              });

              // 計算回程沿線最短距離
              let inMinDist = Infinity;
              let inNearestStop = null;
              inStops.forEach(s => {
                const sData = globalStopMap.get('KMB_' + s.stop);
                if (sData) {
                  const d = getDistance(pos.lat, pos.lng, sData.lat, sData.lng);
                  if (d < inMinDist) {
                    inMinDist = d;
                    inNearestStop = { seq: s.seq, stopId: s.stop, ...sData };
                  }
                }
              });

              // 智能判斷：哪個方向的終點站是目的地？
              // 九巴 route catalog 記錄的 dest 通常是去程終點
              const isOutDest = rObj.dest.includes(dest);
              const isInDest = rObj.orig.includes(dest); // 回程終點即為去程起點

              let chosenDir = 'outbound';
              let finalDist = outMinDist;
              let chosenStop = outNearestStop;

              if (isInDest && inStops.length) {
                chosenDir = 'inbound';
                finalDist = inMinDist;
                chosenStop = inNearestStop;
              } else if (isOutDest && outStops.length) {
                chosenDir = 'outbound';
                finalDist = outMinDist;
                chosenStop = outNearestStop;
              } else {
                // 若文字沒直接命中，選距離身邊最近的方向
                if (inMinDist < outMinDist && inStops.length) {
                  chosenDir = 'inbound';
                  finalDist = inMinDist;
                  chosenStop = inNearestStop;
                }
              }

              return {
                route: rt,
                co: rObj.co,
                dist: finalDist,
                targetDir: chosenDir,
                nearestStop: chosenStop
              };
            } catch (e) {
              return { route: rt, co: rObj.co, dist: 999999, targetDir: 'outbound', nearestStop: null };
            }
          })
        );

        // 距離最近排序
        scoredRoutes.sort((a, b) => a.dist - b.dist);
      } else {
        scoredRoutes = candidateList.map(rt => ({
          route: rt,
          co: (allRoutesCatalog.find(i => i.route === rt) || {}).co || 'KMB',
          dist: 0,
          targetDir: 'outbound',
          nearestStop: null
        }));
      }

      matchedRoutesChips.innerHTML = '';
      if (!scoredRoutes.length) {
        matchedRoutesBar.classList.add('hidden');
        statusBar.textContent = `⚠️ 未搵到前往「${dest}」的路線`;
        return;
      }

      matchedRoutesBar.classList.remove('hidden');

      scoredRoutes.slice(0, 12).forEach((item, idx) => {
        const chip = document.createElement('button');
        const distLabel = (item.dist && item.dist < 10000) ? `(${Math.round(item.dist)}m)` : '';
        chip.className = `px-3 py-1.5 rounded-xl text-xs font-black border shrink-0 transition flex items-center gap-1 ${
          idx === 0 ? 'bg-blue-600 text-white border-blue-600 shadow' : 'bg-white hover:bg-slate-50 text-slate-800 border-slate-200'
        }`;
        chip.innerHTML = `<span>${item.route}</span> <span class="text-[10px] opacity-80">${distLabel}</span>`;
        chip.onclick = () => {
          [...matchedRoutesChips.children].forEach(c => c.className = 'px-3 py-1.5 rounded-xl text-xs font-black border shrink-0 bg-white text-slate-800 border-slate-200');
          chip.className = 'px-3 py-1.5 rounded-xl text-xs font-black border shrink-0 bg-blue-600 text-white border-blue-600 shadow';
          loadRouteFullTimeline(item.route, item.co, item.targetDir);
        };
        matchedRoutesChips.appendChild(chip);
      });

      // 自動載入最近的第一位 (例如 265B，自動帶入 inbound 回程)
      const topRoute = scoredRoutes[0];
      loadRouteFullTimeline(topRoute.route, topRoute.co, topRoute.targetDir);
    }

    inputDest.addEventListener('input', (e) => {
      const q = e.target.value.trim().toUpperCase();
      if (!q) {
        destSuggestBox.classList.add('hidden');
        return;
      }

      let matchedItems = [];
      Object.keys(PLACE_SHORTFORMS).forEach(sf => {
        if (sf.startsWith(q)) {
          matchedItems.push({ label: `${sf} ➔ ${PLACE_SHORTFORMS[sf]}`, value: PLACE_SHORTFORMS[sf] });
        }
      });
      Object.keys(CORRIDOR_INDEX).forEach(place => {
        if (place.includes(q)) matchedItems.push({ label: place, value: place });
      });

      destSuggestBox.innerHTML = '';
      if (!matchedItems.length) {
        destSuggestBox.classList.add('hidden');
        return;
      }

      matchedItems.slice(0, 6).forEach(m => {
        const row = document.createElement('div');
        row.className = 'px-3.5 py-2 hover:bg-slate-50 cursor-pointer flex items-center gap-2 text-xs font-bold text-slate-700';
        row.innerHTML = `<span>📍 地點:</span> <span class="text-blue-600 font-black">${m.label}</span>`;
        row.onclick = () => {
          inputDest.value = m.value;
          destSuggestBox.classList.add('hidden');
          triggerDestSearch(m.value);
        };
        destSuggestBox.appendChild(row);
      });
      destSuggestBox.classList.remove('hidden');
    });

    inputDest.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') triggerDestSearch(inputDest.value.trim());
    });

    btnQuickReverse.onclick = () => {
      if (availableDirs.length > 1) {
        currentDir = (currentDir === 'outbound') ? 'inbound' : 'outbound';
        renderDirButtons();
        renderTimelineFast();
        statusBar.textContent = `🔄 路線 ${currentRoute}：已手動掉轉方向 (${currentDir === 'outbound' ? '去程' : '回程'})`;
      }
    };

    // ==================== 載入全線時間軸與精確最近站標註 ====================
    async function loadRouteFullTimeline(route, company = 'KMB', preferredDir = null) {
      currentRoute = route;
      currentCompany = company;
      statusBar.textContent = `⚡ 正在載入 ${route} 站點...`;
      timelineContainer.innerHTML = '<div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 py-10"><div class="inline-block animate-spin mr-1">⏳</div> 載入中...</div>';
      
      dirPanel.classList.add('hidden');
      clearInterval(refreshInterval);
      refreshBadge.classList.add('hidden');

      const [pos, kmbOut, kmbIn, ctbOut, ctbIn] = await Promise.all([
        ensureUserLocation(),
        fetch(`${API_KMB_ROUTE_STOP}/${route}/outbound/1`).then(r => r.json()).catch(() => ({})),
        fetch(`${API_KMB_ROUTE_STOP}/${route}/inbound/1`).then(r => r.json()).catch(() => ({})),
        fetch(`${API_CTB_ROUTE_STOP}/${route}/outbound`).then(r => r.json()).catch(() => ({})),
        fetch(`${API_CTB_ROUTE_STOP}/${route}/inbound`).then(r => r.json()).catch(() => ({}))
      ]);

      availableDirs = [];
      if (company === 'KMB') {
        if (kmbOut.data?.length) availableDirs.push('outbound');
        if (kmbIn.data?.length) availableDirs.push('inbound');
      } else {
        if (ctbOut.data?.length) availableDirs.push('outbound');
        if (ctbIn.data?.length) availableDirs.push('inbound');
      }

      if (!availableDirs.length) {
        statusBar.textContent = `❌ 搵唔到路線 ${route} 的站點資料`;
        timelineContainer.innerHTML = '';
        return;
      }

      // 自動採納最合理方向 (例如回程往天水圍)
      currentDir = (preferredDir && availableDirs.includes(preferredDir)) ? preferredDir : availableDirs[0];

      renderDirButtons();
      renderTimelineFast(pos);
    }

    function renderDirButtons() {
      dirButtons.innerHTML = '';
      dirPanel.classList.remove('hidden');
      availableDirs.forEach(dir => {
        const btn = document.createElement('button');
        const isActive = dir === currentDir;
        btn.className = `flex-1 py-1.5 rounded-lg text-xs font-black transition ${
          isActive ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600'
        }`;
        btn.textContent = dir === 'outbound' ? '去程' : '回程';
        btn.onclick = () => {
          if (currentDir === dir) return;
          currentDir = dir;
          renderDirButtons();
          renderTimelineFast();
        };
        dirButtons.appendChild(btn);
      });
    }

    async function renderTimelineFast(pos = null) {
      if (!pos) pos = await ensureUserLocation();

      let rawStops = [];
      if (currentCompany === 'KMB') {
        const res = await fetch(`${API_KMB_ROUTE_STOP}/${currentRoute}/${currentDir}/1`).then(r => r.json());
        rawStops = res.data || [];
      } else {
        const res = await fetch(`${API_CTB_ROUTE_STOP}/${currentRoute}/${currentDir}`).then(r => r.json());
        rawStops = res.data || [];
      }

      allRouteStops = await Promise.all(rawStops.map(async (s) => {
        const key = currentCompany + '_' + s.stop;
        if (globalStopMap.has(key)) {
          return { seq: s.seq, stopId: s.stop, ...globalStopMap.get(key) };
        }
        const api = currentCompany === 'KMB' ? `${API_KMB_ALL_STOPS}/${s.stop}` : `${API_CTB_STOP}${s.stop}`;
        const sRes = await fetch(api).then(r => r.json()).catch(() => ({}));
        const obj = {
          name: sRes.data?.name_tc || '未知分站',
          lat: parseFloat(sRes.data?.lat || 0),
          lng: parseFloat(sRes.data?.long || 0)
        };
        globalStopMap.set(key, obj);
        return { seq: s.seq, stopId: s.stop, ...obj };
      }));

      // 精準計算最近上車點
      nearestStopIndex = -1;
      if (pos) {
        let minDist = Infinity;
        allRouteStops.forEach((s, idx) => {
          if (s.lat && s.lng) {
            const dist = getDistance(pos.lat, pos.lng, s.lat, s.lng);
            s.dist = dist;
            if (dist < minDist) {
              minDist = dist;
              nearestStopIndex = idx;
            }
          }
        });
        
        // 唯有真正搵到最近站時才標記
        if (nearestStopIndex !== -1) {
          statusBar.textContent = `🎯 路線 ${currentRoute}：已鎖定身邊最近車站【${allRouteStops[nearestStopIndex].name}】(約 ${Math.round(minDist)}m)`;
        }
      } else {
        statusBar.textContent = `🎯 路線 ${currentRoute} (共 ${allRouteStops.length} 站 · 未定位)`;
      }

      drawTimelineUI();
      refreshUpcomingETAs();
      startAutoRefresh();
    }

    function drawTimelineUI() {
      timelineContainer.innerHTML = '';
      const listWrapper = document.createElement('div');
      listWrapper.className = 'bg-white p-4 md:p-6 rounded-2xl border border-slate-200 shadow-sm relative';

      const headerTitle = `
        <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <span class="text-lg font-black text-slate-900">路線 ${currentRoute}</span>
            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">共 ${allRouteStops.length} 站</span>
          </div>
          <span class="text-xs text-slate-400 font-medium">${currentCompany === 'KMB' ? '九巴' : '城巴'} (${currentDir === 'outbound' ? '去程' : '回程'})</span>
        </div>
      `;

      let htmlBuffer = headerTitle;

      allRouteStops.forEach((stop, idx) => {
        // 如果未有 GPS，不隨便將第 1 站當作已過或最近站
        const hasPos = nearestStopIndex !== -1;
        const isPassed = hasPos && idx < nearestStopIndex;
        const isCurrent = hasPos && idx === nearestStopIndex;
        const isLast = idx === allRouteStops.length - 1;

        const lineHtml = isLast ? '' : `
          <div class="absolute left-[11px] top-4 bottom-0 w-[3px] -z-0 ${isPassed ? 'bg-slate-200' : 'bg-emerald-400'}"></div>
        `;

        let nodeHtml = '';
        if (isCurrent) {
          nodeHtml = `
            <div class="relative z-10 flex items-center justify-center w-6 h-6 shrink-0 mt-0.5">
              <div class="absolute w-full h-full bg-emerald-500 rounded-full animate-ping-slow opacity-75"></div>
              <div class="w-4 h-4 bg-emerald-600 rounded-full border-2 border-white shadow-md flex items-center justify-center">
                <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
              </div>
            </div>
          `;
        } else if (isPassed) {
          nodeHtml = `
            <div class="relative z-10 flex items-center justify-center w-6 h-6 shrink-0 mt-0.5">
              <div class="w-2.5 h-2.5 bg-slate-300 rounded-full"></div>
            </div>
          `;
        } else {
          nodeHtml = `
            <div class="relative z-10 flex items-center justify-center w-6 h-6 shrink-0 mt-0.5">
              <div class="w-3 h-3 bg-white border-2 border-emerald-500 rounded-full shadow-sm"></div>
            </div>
          `;
        }

        const infoHtml = `
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] ${isPassed ? 'text-slate-300' : (isCurrent ? 'text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded font-black' : 'text-slate-400')}">#${stop.seq}</span>
                <span class="text-sm font-bold ${isPassed ? 'text-slate-300 line-through' : (isCurrent ? 'text-slate-900 font-black text-base' : 'text-slate-700')}">${stop.name}</span>
                <span class="text-[10px] text-slate-300 font-medium">(${stop.stopId})</span>
                ${isCurrent ? '<span class="text-[10px] bg-emerald-600 text-white font-black px-1.5 py-0.5 rounded-full shadow-sm">📍 最近上車</span>' : ''}
              </div>
              ${stop.dist !== undefined && isCurrent ? `<span class="text-xs font-black text-emerald-600">約 ${Math.round(stop.dist)}m</span>` : ''}
            </div>
            ${!isPassed ? `<div id="tl-eta-${stop.stopId}" class="mt-1 space-y-1"><span class="text-[11px] text-slate-400">載入班次中...</span></div>` : ''}
          </div>
        `;

        htmlBuffer += `
          <div class="flex items-start gap-3 relative pb-6 last:pb-2" id="stop-node-${idx}">
            ${lineHtml}
            ${nodeHtml}
            ${infoHtml}
          </div>
        `;
      });

      listWrapper.innerHTML = htmlBuffer;
      timelineContainer.appendChild(listWrapper);

      // 置中捲動
      setTimeout(() => {
        if (nearestStopIndex !== -1) {
          const targetNode = document.getElementById(`stop-node-${nearestStopIndex}`);
          if (targetNode) targetNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 150);
    }

    function refreshUpcomingETAs() {
      const startIndex = nearestStopIndex === -1 ? 0 : nearestStopIndex;
      const activeTargets = allRouteStops.slice(startIndex, startIndex + 4);
      
      activeTargets.forEach(stop => {
        const etaBox = document.getElementById(`tl-eta-${stop.stopId}`);
        if (!etaBox) return;

        const url = currentCompany === 'KMB' 
          ? `${API_KMB_ETA}/${stop.stopId}/${currentRoute}/1`
          : `${API_CTB_ETA}/${stop.stopId}/${currentRoute}`;

        fetch(url).then(r => r.json()).then(json => {
          let etas = json.data || [];
          if (currentCompany === 'CTB') {
            etas = etas.filter(e => e.dir === (currentDir === 'outbound' ? 'O' : 'I'));
          } else {
            etas = etas.filter(e => e.route === currentRoute);
          }

          if (!etas.length) {
            etaBox.innerHTML = '<span class="text-[10px] text-slate-400">暫無班次</span>';
            return;
          }

          etaBox.innerHTML = etas.slice(0, 2).map((item, idx) => {
            if (!item.eta) return `<span class="text-[10px] text-slate-400 mr-2">第${idx+1}班: 未開出</span>`;
            const diffMin = Math.round((new Date(item.eta) - new Date()) / 60000);
            const label = diffMin <= 0 ? '即將抵達' : `${diffMin} 分鐘`;
            const isUrgent = diffMin <= 3;
            return `
              <span class="inline-flex items-center gap-1 mr-2 px-2 py-0.5 rounded text-xs font-black ${
                isUrgent ? 'bg-rose-600 text-white animate-pulse' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'
              }">
                🚍 ${label}
              </span>
            `;
          }).join('');
        }).catch(() => {
          etaBox.innerHTML = '<span class="text-[10px] text-rose-400">無法獲取</span>';
        });
      });
    }

    function startAutoRefresh() {
      clearInterval(refreshInterval);
      countdownSec = 30;
      refreshBadge.classList.remove('hidden');
      timerSec.textContent = countdownSec;
      refreshInterval = setInterval(() => {
        countdownSec--;
        timerSec.textContent = countdownSec;
        if (countdownSec <= 0) {
          countdownSec = 30;
          refreshUpcomingETAs();
        }
      }, 1000);
    }

    initSystem();
  </script>
</body>
</html>
