<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>全港巴士實時雷達 + 麗湖居專巴</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    button, input { touch-action: manipulation; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16 select-none font-sans">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-4 py-3 shadow sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-xl">🚌</span>
      <div>
        <h1 class="text-base font-black tracking-wide leading-none">全港巴士實時雷達</h1>
        <span class="text-[10px] text-slate-400">九巴 · 城巴 · 港鐵巴士 · 麗湖居專巴</span>
      </div>
    </div>
    <div id="refresh-badge" class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-slate-300 hidden">
      更新: <span id="timer-sec">30</span>s
    </div>
  </header>

  <main class="max-w-md mx-auto p-3 space-y-3">

    <!-- 麗湖居專巴即時倒數 Widget -->
    <div class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-4 rounded-2xl shadow-md space-y-2.5">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-1.5">
          <span class="text-lg">🏡</span>
          <h2 class="font-black text-sm tracking-wide">麗湖居專巴 ➔ 天水圍站</h2>
        </div>
        
        <!-- 平日 / 假日 切換鈕 -->
        <div class="flex bg-black/20 p-0.5 rounded-lg text-[11px] font-bold">
          <button id="btn-sch-weekday" class="px-2 py-0.5 rounded-md transition">平日</button>
          <button id="btn-sch-holiday" class="px-2 py-0.5 rounded-md transition">假日</button>
        </div>
      </div>

      <div id="shuttle-main" class="pt-1 flex justify-between items-end">
        <div>
          <div class="text-[11px] text-emerald-100 font-medium">下一班車開出</div>
          <div id="shuttle-next-time" class="text-2xl font-black tracking-tight">--:--</div>
        </div>
        <div class="text-right">
          <div id="shuttle-countdown" class="text-3xl font-black text-amber-300">計算中...</div>
          <div id="shuttle-note" class="text-[11px] font-bold"></div>
        </div>
      </div>

      <!-- 隨後班次預告 -->
      <div class="pt-2 border-t border-white/15 flex justify-between items-center text-xs text-emerald-100" id="shuttle-upcoming">
        <span>隨後班次: 載入中...</span>
      </div>
    </div>
    
    <!-- 巴士搜尋與模糊建議容器 -->
    <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5 relative z-40">
      <div class="relative">
        <div class="flex gap-2">
          <input type="text" id="route-input" placeholder="路線 (例: K73, 98D, E22, 1A)" 
                 inputmode="text" autocapitalize="characters" autocomplete="off"
                 class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 font-bold text-lg uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none" />
          <button id="btn-search-route" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl active:scale-95 transition text-base">
            搵車
          </button>
        </div>

        <!-- 模糊搜尋下拉建議選單 -->
        <div id="suggestions-box" class="absolute left-0 right-0 top-full mt-1.5 bg-white rounded-xl shadow-2xl border border-slate-200 max-h-64 overflow-y-auto hidden z-50 divide-y divide-slate-100">
        </div>
      </div>

      <!-- 常用歷史 Chips -->
      <div id="history-box" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 hidden">
        <span class="text-xs text-slate-400 shrink-0 font-medium">常用:</span>
        <div id="history-chips" class="flex gap-1.5"></div>
      </div>

      <!-- 方向列 + 對調掣 -->
      <div id="dir-panel" class="hidden flex items-center gap-2 pt-1 border-t border-slate-100">
        <div id="dir-buttons" class="flex flex-1 gap-1.5"></div>
        <button id="btn-reverse" title="對調去程/回程" class="bg-slate-100 active:bg-slate-300 text-slate-700 font-bold px-3.5 py-2 rounded-xl text-base border border-slate-300 active:rotate-180 transition-transform flex items-center justify-center">
          ⇆
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar" class="text-xs text-slate-400 text-center font-medium">輸入路線號碼查詢班次</div>

    <!-- 列表展示區 -->
    <div id="results" class="space-y-3 relative z-10"></div>

  </main>

  <script>
    // ==================== 1. 麗湖居專巴完整數據庫 ====================
    // 平日 (星期一至五，公眾假期除外) - 尾班車 22:52
    // # 代表不途經天水圍西鐵站
    const SCHEDULE_WEEKDAY = [
      "06:15", "06:25", "06:35", "06:43", "06:51", "06:58",

      "08:03", "08:09", "08:14", "08:20", "08:25", "08:31", "08:36", "08:42", "08:47", "08:53", "08:58",
      "09:04", "09:11", "09:18", "09:25", "09:32", "09:39", "09:46", "09:53",
      "10:00", "10:07", "10:15", "10:22", "10:30", "10:37", "10:45", "10:52",

      "12:00", "12:07", "12:15", "12:22", "12:30", "12:37", "12:45", "12:52",
      "13:00", "13:07", "13:15", "13:22", "13:30", "13:37", "13:45", "13:52",
      "15:00", "15:07", "15:15", "15:22", "15:30", "15:37", "15:45", "15:52",
      "16:00", "16:07", "16:15", "16:22", "16:30", "16:37", "16:45", "16:52",
      "17:00", "17:07", "17:15", "17:22", "17:30", "17:37", "17:45", "17:54",
      "18:00#", "18:05", "18:13", "18:20", "18:30#", "18:35", "18:43", "18:50",
      "19:00#", "19:05", "19:13", "19:20", "19:30#", "19:35", "19:43", "19:50",
      "20:00", "20:07", "20:15", "20:22", "20:30", "20:37", "20:45", "20:52",
      "21:00", "21:07", "21:15", "21:22", "21:30", "21:37", "21:45", "21:52",

    // 星期六、日及公眾假期 - 尾班車 00:00 (24:00)
    // ◆ 代表途經麗湖居第 2 座落客
    const SCHEDULE_HOLIDAY = [
      "06:15", "06:25", "06:35", "06:43", "06:51", "06:58",
      "07:04", "07:10", "07:16", "07:22", "07:28", "07:34", "07:40", "07:46", "07:52", "07:58",
      "08:03", "08:09", "08:14", "08:20", "08:25", "08:31", "08:36", "08:42", "08:47", "08:53", "08:58",
      "09:04", "09:11", "09:18", "09:25", "09:32", "09:39", "09:46", "09:53",
      "10:00◆", "10:07◆", "10:15◆", "10:22◆", "10:30◆", "10:37◆", "10:45◆", "10:52◆",
      "11:00◆", "11:07◆", "11:15◆", "11:22◆", "11:30◆", "11:37◆", "11:45◆", "11:52◆",
      "12:00◆", "12:07◆", "12:15◆", "12:22◆", "12:30◆", "12:37◆", "12:45◆", "12:52◆",
      "13:00◆", "13:07◆", "13:15◆", "13:22◆", "13:30◆", "13:37◆", "13:45◆", "13:52◆",
      "14:00◆", "14:07◆", "14:15◆", "14:22◆", "14:30◆", "14:37◆", "14:45◆", "14:52◆",
      "15:00◆", "15:07◆", "15:15◆", "15:22◆", "15:30◆", "15:37◆", "15:45◆", "15:52◆",
      "16:00◆", "16:07", "16:15", "16:22", "16:30", "16:37", "16:45", "16:52",
      "17:00", "17:07", "17:15", "17:22", "17:30", "17:37", "17:45", "17:52",
      "18:00", "18:07", "18:15", "18:22", "18:30", "18:37", "18:45", "18:52",
      "19:00", "19:07", "19:15", "19:22", "19:30", "19:37", "19:45", "19:52",
      "20:00", "20:07", "20:15", "20:22", "20:30", "20:37", "20:45", "20:52",
      "21:00", "21:07", "21:15", "21:22", "21:30", "21:37", "21:45", "21:52",
      "22:00", "22:07", "22:15", "22:22", "22:30", "22:37", "22:45", "22:52",
      "23:00", "23:07", "23:15", "23:22", "23:30", "23:37", "23:45", "23:52",
      "24:00"
    ];

    // 判斷今日預設係咪週末 (0 = 週日, 6 = 週六)
    const todayDay = new Date().getDay();
    let isHolidayMode = (todayDay === 0 || todayDay === 6);

    const btnWeekday = document.getElementById('btn-sch-weekday');
    const btnHoliday = document.getElementById('btn-sch-holiday');

    function syncScheduleToggleUI() {
      if (isHolidayMode) {
        btnHoliday.className = 'px-2 py-0.5 rounded-md transition bg-white text-emerald-800 shadow-sm';
        btnWeekday.className = 'px-2 py-0.5 rounded-md transition text-white/80 hover:text-white';
      } else {
        btnWeekday.className = 'px-2 py-0.5 rounded-md transition bg-white text-emerald-800 shadow-sm';
        btnHoliday.className = 'px-2 py-0.5 rounded-md transition text-white/80 hover:text-white';
      }
    }

    btnWeekday.onclick = () => { isHolidayMode = false; syncScheduleToggleUI(); updateShuttleWidget(); };
    btnHoliday.onclick = () => { isHolidayMode = true; syncScheduleToggleUI(); updateShuttleWidget(); };
    syncScheduleToggleUI();

    function updateShuttleWidget() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const currentSeconds = now.getSeconds();

      const activeSchedule = isHolidayMode ? SCHEDULE_HOLIDAY : SCHEDULE_WEEKDAY;
      let upcoming = [];

      for (let rawItem of activeSchedule) {
        const isSkipMTR = rawItem.includes('#');
        const isViaBlock2 = rawItem.includes('◆');
        const cleanTime = rawItem.replace('#', '').replace('◆', '');
        
        let [h, m] = cleanTime.split(':').map(Number);
        const totalMin = h * 60 + m;

        if (totalMin >= currentMinutes) {
          const diffSec = (totalMin - currentMinutes) * 60 - currentSeconds;
          if (diffSec >= 0) {
            upcoming.push({
              time: cleanTime === '24:00' ? '00:00' : cleanTime,
              diffSec,
              isSkipMTR,
              isViaBlock2
            });
          }
        }
      }

      const nextTimeEl = document.getElementById('shuttle-next-time');
      const countdownEl = document.getElementById('shuttle-countdown');
      const noteEl = document.getElementById('shuttle-note');
      const upcomingEl = document.getElementById('shuttle-upcoming');

      if (!upcoming.length) {
        nextTimeEl.textContent = '今日服務已完結';
        countdownEl.textContent = '尾班已過';
        countdownEl.className = 'text-2xl font-black text-slate-300';
        noteEl.textContent = '';
        upcomingEl.innerHTML = '<span>明日頭班車: 06:15 開出</span>';
        return;
      }

      const first = upcoming[0];
      const minLeft = Math.floor(first.diffSec / 60);
      const secLeft = first.diffSec % 60;

      nextTimeEl.textContent = first.time;

      // 標註提示
      if (first.isSkipMTR) {
        noteEl.innerHTML = '<span class="text-rose-200 bg-rose-900/60 px-2 py-0.5 rounded">⚠️ 不停西鐵站</span>';
      } else if (first.isViaBlock2) {
        noteEl.innerHTML = '<span class="text-amber-200">途經第 2 座</span>';
      } else {
        noteEl.innerHTML = '<span class="text-emerald-100">天水圍站直達</span>';
      }

      if (minLeft <= 0) {
        countdownEl.textContent = `即將開出 (${secLeft}s)`;
        countdownEl.className = 'text-2xl font-black text-rose-300 animate-pulse';
      } else {
        countdownEl.textContent = `${minLeft}分 ${secLeft}秒`;
        countdownEl.className = 'text-3xl font-black text-amber-300';
      }

      // 下 2 班預覽
      const rest = upcoming.slice(1, 3);
      if (rest.length) {
        upcomingEl.innerHTML = `
          <span>隨後: <b>${rest.map(r => {
            let label = r.time;
            if (r.isSkipMTR) label += '(不經西鐵)';
            if (r.isViaBlock2) label += '(經2座)';
            return label;
          }).join(' · ')}</b></span>
        `;
      } else {
        upcomingEl.innerHTML = '<span>此班為最後班次</span>';
      }
    }

    // 每秒即時倒數
    setInterval(updateShuttleWidget, 1000);
    updateShuttleWidget();

    // ==================== 2. 全港巴士雷達邏輯 ====================
    const MTR_BUS_ROUTES = [
      { route: "K73", orig: "天恒", dest: "元朗(西)", co: "MTR" },
      { route: "K74", orig: "天水圍市中心", dest: "凹頭 (循環線)", co: "MTR" },
      { route: "K75A", orig: "天水圍站", dest: "洪水橋 (循環線)", co: "MTR" },
      { route: "K75P", orig: "天瑞", dest: "洪水橋 (循環線)", co: "MTR" },
      { route: "K75S", orig: "天水圍站", dest: "洪福邨", co: "MTR" },
      { route: "K76", orig: "天恒", dest: "天水圍站", co: "MTR" },
      { route: "K76S", orig: "濕地公園路", dest: "天水圍站", co: "MTR" },
      { route: "K65", orig: "元朗站", dest: "流浮山", co: "MTR" },
      { route: "K65A", orig: "天恩", dest: "流浮山", co: "MTR" },
      { route: "K66", orig: "朗屏", dest: "大棠黃泥墩村", co: "MTR" },
      { route: "K66A", orig: "朗屏", dest: "大棠山道", co: "MTR" },
      { route: "K68", orig: "元朗工業邨", dest: "元朗公園 (循環線)", co: "MTR" },
      { route: "K51", orig: "富泰", dest: "大欖", co: "MTR" },
      { route: "K51A", orig: "富泰", dest: "掃管笏", co: "MTR" },
      { route: "K52", orig: "屯門站", dest: "龍鼓灘", co: "MTR" },
      { route: "K52A", orig: "屯門站", dest: "曾咀", co: "MTR" },
      { route: "K52S", orig: "屯門站", dest: "龍鼓灘", co: "MTR" },
      { route: "K53", orig: "屯門站", dest: "掃管笏 (循環線)", co: "MTR" },
      { route: "K54", orig: "和田邨", dest: "屯門市中心 (循環線)", co: "MTR" },
      { route: "K58", orig: "富泰", dest: "青山灣", co: "MTR" },
      { route: "506", orig: "屯門碼頭", dest: "兆麟", co: "MTR" },
      { route: "K12", orig: "大埔墟站", dest: "八號花園", co: "MTR" },
      { route: "K14", orig: "大埔超級城", dest: "大埔墟站", co: "MTR" },
      { route: "K17", orig: "大埔墟站", dest: "富善", co: "MTR" },
      { route: "K18", orig: "大埔墟站", dest: "廣福", co: "MTR" }
    ];

    const API_KMB_ROUTES = 'https://data.etabus.gov.hk/v1/transport/kmb/route/';
    const API_KMB_ROUTE_STOP = 'https://data.etabus.gov.hk/v1/transport/kmb/route-stop';
    const API_KMB_STOP = 'https://data.etabus.gov.hk/v1/transport/kmb/stop/';
    const API_KMB_ETA = 'https://data.etabus.gov.hk/v1/transport/kmb/eta';

    const API_CTB_ROUTE_STOP = 'https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB';
    const API_CTB_STOP = 'https://rt.data.gov.hk/v2/transport/citybus/stop/';
    const API_CTB_ETA = 'https://rt.data.gov.hk/v2/transport/citybus/eta/CTB';

    const API_MTR_BUS_ETA = 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule';

    const ROUTES_CACHE_KEY = 'hk_all_routes_v4';
    const HISTORY_KEY = 'hk_recent_routes_v4';

    const routeInput = document.getElementById('route-input');
    const suggestionsBox = document.getElementById('suggestions-box');
    const btnSearch = document.getElementById('btn-search-route');
    const btnReverse = document.getElementById('btn-reverse');
    const dirPanel = document.getElementById('dir-panel');
    const dirButtons = document.getElementById('dir-buttons');
    const statusBar = document.getElementById('status-bar');
    const results = document.getElementById('results');
    const historyBox = document.getElementById('history-box');
    const historyChips = document.getElementById('history-chips');
    const refreshBadge = document.getElementById('refresh-badge');
    const timerSec = document.getElementById('timer-sec');

    let allRoutesCatalog = [];
    let currentCompany = '';
    let currentRoute = '';
    let currentDir = 'outbound';
    let availableDirs = [];
    let activeStopsToFetch = [];
    const stopCache = new Map();
    let refreshInterval = null;
    let countdownSec = 30;

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getUserLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
          () => resolve(null),
          { timeout: 5000, enableHighAccuracy: true }
        );
      });
    }

    async function initCatalog() {
      const cached = localStorage.getItem(ROUTES_CACHE_KEY);
      if (cached) {
        allRoutesCatalog = JSON.parse(cached);
        statusBar.textContent = `✅ 路線庫已就緒 (${allRoutesCatalog.length} 條路線)`;
        return;
      }

      try {
        statusBar.textContent = '🔄 預載全港路線數據中...';
        const res = await fetch(API_KMB_ROUTES);
        const json = await res.json();
        
        const map = new Map();
        MTR_BUS_ROUTES.forEach(r => map.set(r.route, r));
        (json.data || []).forEach(r => {
          if (!map.has(r.route)) {
            map.set(r.route, { route: r.route, orig: r.orig_tc, dest: r.dest_tc, co: 'KMB' });
          }
        });

        allRoutesCatalog = Array.from(map.values());
        localStorage.setItem(ROUTES_CACHE_KEY, JSON.stringify(allRoutesCatalog));
        statusBar.textContent = `✅ 路線庫已就緒 (${allRoutesCatalog.length} 條路線)`;
      } catch (e) {
        allRoutesCatalog = MTR_BUS_ROUTES;
        statusBar.textContent = '⚠️ 預載部分路線庫，支援手動輸入';
      }
    }

    routeInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toUpperCase();
      if (!query) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      const matches = allRoutesCatalog.filter(r => r.route.includes(query))
        .sort((a, b) => {
          const aStarts = a.route.startsWith(query);
          const bStarts = b.route.startsWith(query);
          if (aStarts && !bStarts) return -1;
          if (!aStarts && bStarts) return 1;
          return a.route.localeCompare(b.route, undefined, { numeric: true });
        })
        .slice(0, 10);

      renderSuggestions(matches);
    });

    function renderSuggestions(list) {
      if (!list.length) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      suggestionsBox.innerHTML = '';
      list.forEach(item => {
        const row = document.createElement('div');
        row.className = 'px-4 py-2.5 hover:bg-slate-50 active:bg-slate-100 cursor-pointer flex justify-between items-center transition';
        const tagBg = item.co === 'MTR' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="font-black text-base ${item.co === 'MTR' ? 'text-emerald-600' : 'text-red-600'}">${item.route}</span>
            <span class="text-xs ${tagBg} px-1.5 py-0.5 rounded font-bold">${item.co}</span>
            <span class="text-xs text-slate-500 font-medium truncate max-w-[170px]">${item.orig} ➔ ${item.dest}</span>
          </div>
          <span class="text-xs text-slate-400">選擇</span>
        `;
        row.onclick = () => {
          routeInput.value = item.route;
          suggestionsBox.classList.add('hidden');
          searchRoute();
        };
        suggestionsBox.appendChild(row);
      });
      suggestionsBox.classList.remove('hidden');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#route-input') && !e.target.closest('#suggestions-box')) {
        suggestionsBox.classList.add('hidden');
      }
    });

    function loadHistory() {
      const list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      if (!list.length) { historyBox.classList.add('hidden'); return; }
      historyBox.classList.remove('hidden');
      historyChips.innerHTML = '';
      list.forEach(rt => {
        const chip = document.createElement('button');
        chip.className = 'px-2.5 py-1 bg-slate-100 active:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold border border-slate-200';
        chip.textContent = rt;
        chip.onclick = () => {
          routeInput.value = rt;
          suggestionsBox.classList.add('hidden');
          searchRoute();
        };
        historyChips.appendChild(chip);
      });
    }

    function saveHistory(rt) {
      let list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      list = [rt, ...list.filter(item => item !== rt)].slice(0, 5);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
      loadHistory();
    }

    async function searchRoute() {
      const route = routeInput.value.trim().toUpperCase();
      if (!route) return;
      routeInput.blur();
      suggestionsBox.classList.add('hidden');

      currentRoute = route;
      saveHistory(route);
      statusBar.textContent = `🔍 搜尋路線 ${route} 中...`;
      results.innerHTML = '';
      dirPanel.classList.add('hidden');
      dirButtons.innerHTML = '';
      availableDirs = [];
      clearInterval(refreshInterval);
      refreshBadge.classList.add('hidden');

      const isMtrBus = MTR_BUS_ROUTES.some(r => r.route === route);
      if (isMtrBus) {
        currentCompany = 'MTR';
        loadMTRBusStops(route);
        return;
      }

      try {
        const [kmbOut, kmbIn, ctbOut, ctbIn] = await Promise.all([
          fetch(`${API_KMB_ROUTE_STOP}/${route}/outbound/1`).then(r => r.json()).catch(() => ({})),
          fetch(`${API_KMB_ROUTE_STOP}/${route}/inbound/1`).then(r => r.json()).catch(() => ({})),
          fetch(`${API_CTB_ROUTE_STOP}/${route}/outbound`).then(r => r.json()).catch(() => ({})),
          fetch(`${API_CTB_ROUTE_STOP}/${route}/inbound`).then(r => r.json()).catch(() => ({}))
        ]);

        const kmbValid = (kmbOut.data && kmbOut.data.length) || (kmbIn.data && kmbIn.data.length);
        const ctbValid = (ctbOut.data && ctbOut.data.length) || (ctbIn.data && ctbIn.data.length);

        if (kmbValid) {
          currentCompany = 'KMB';
          if (kmbOut.data && kmbOut.data.length) availableDirs.push('outbound');
          if (kmbIn.data && kmbIn.data.length) availableDirs.push('inbound');
        } else if (ctbValid) {
          currentCompany = 'CTB';
          if (ctbOut.data && ctbOut.data.length) availableDirs.push('outbound');
          if (ctbIn.data && ctbIn.data.length) availableDirs.push('inbound');
        } else {
          statusBar.textContent = `❌ 搵唔到路線 ${route}，請檢查號碼`;
          return;
        }

        currentDir = availableDirs[0];
        dirPanel.classList.remove('hidden');
        renderDirButtons();
        loadFranchisedBusStops();
        startAutoRefresh();

      } catch (e) {
        statusBar.textContent = '❌ 網絡繁忙，請稍後重試';
      }
    }

    async function loadMTRBusStops(route) {
      statusBar.textContent = `📍 正在獲取港鐵巴士 ${route} 站點及班次...`;
      results.innerHTML = '<div class="text-center text-slate-400 py-10"><div class="inline-block animate-spin mr-1">⏳</div> 載入中...</div>';

      try {
        const res = await fetch(API_MTR_BUS_ETA, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: "zh", routeName: route })
        });
        const data = await res.json();
        const busStops = data.busStop || [];

        if (!busStops.length) {
          statusBar.textContent = `❌ 港鐵巴士 ${route} 暫無服務或已過尾班車`;
          results.innerHTML = '';
          return;
        }

        statusBar.textContent = `🎯 港鐵巴士 ${route} (共 ${busStops.length} 個站點)`;
        results.innerHTML = '';

        busStops.forEach((stop, idx) => {
          const card = document.createElement('div');
          card.className = 'bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2';
          
          let etasHtml = '';
          const buses = stop.bus || [];
          if (!buses.length) {
            etasHtml = '<span class="text-xs text-slate-400">暫無下班車資訊</span>';
          } else {
            etasHtml = buses.slice(0, 3).map(b => {
              const sec = parseInt(b.departureTimeInSecond);
              const min = Math.round(sec / 60);
              const label = min <= 1 ? '即將開出/抵達' : `${min} 分鐘`;
              const isUrgent = min <= 3;
              return `
                <div class="flex justify-between items-center text-xs py-0.5">
                  <span class="text-slate-600 font-medium">${b.departureTimeText || '班次'}</span>
                  <span class="px-2 py-0.5 rounded font-black shrink-0 ${isUrgent ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-100 text-slate-800'}">${label}</span>
                </div>
              `;
            }).join('');
          }

          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-1.5">
                <span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded text-xs font-bold">第 ${idx + 1} 站</span>
                <h3 class="text-base font-black text-slate-800 tracking-tight">${stop.busStopId}</h3>
              </div>
              <span class="text-xs text-slate-400">港鐵巴士</span>
            </div>
            <div class="text-sm space-y-1 pt-1.5 border-t border-slate-100">
              ${etasHtml}
            </div>
          `;
          results.appendChild(card);
        });

        startAutoRefresh();

      } catch (e) {
        statusBar.textContent = '❌ 港鐵巴士伺服器無回應';
        results.innerHTML = '';
      }
    }

    function renderDirButtons() {
      dirButtons.innerHTML = '';
      availableDirs.forEach(dir => {
        const btn = document.createElement('button');
        const isActive = dir === currentDir;
        const tag = currentCompany === 'KMB' ? '九巴' : '城巴';
        btn.className = `flex-1 py-2 rounded-xl text-xs font-bold transition ${
          isActive ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600 active:bg-slate-200'
        }`;
        btn.textContent = `${dir === 'outbound' ? '去程' : '回程'} (${tag})`;
        btn.onclick = () => {
          if (currentDir === dir) return;
          currentDir = dir;
          renderDirButtons();
          loadFranchisedBusStops();
        };
        dirButtons.appendChild(btn);
      });

      btnReverse.disabled = availableDirs.length <= 1;
      btnReverse.classList.toggle('opacity-30', availableDirs.length <= 1);
    }

    btnReverse.onclick = () => {
      if (availableDirs.length <= 1) return;
      currentDir = (currentDir === 'outbound') ? 'inbound' : 'outbound';
      renderDirButtons();
      loadFranchisedBusStops();
    };

    async function loadFranchisedBusStops() {
      statusBar.textContent = '📍 搜尋身邊最近車站...';
      results.innerHTML = '<div class="text-center text-slate-400 py-10"><div class="inline-block animate-spin mr-1">⏳</div> 尋找最近車站中...</div>';

      const pos = await getUserLocation();
      let stopList = [];

      try {
        if (currentCompany === 'KMB') {
          const res = await fetch(`${API_KMB_ROUTE_STOP}/${currentRoute}/${currentDir}/1`).then(r => r.json());
          const stopsData = res.data || [];
          stopList = await Promise.all(stopsData.map(async (s) => {
            if (stopCache.has('K_' + s.stop)) return { seq: s.seq, stopId: s.stop, ...stopCache.get('K_' + s.stop) };
            const sRes = await fetch(`${API_KMB_STOP}${s.stop}`).then(r => r.json());
            const obj = { name: sRes.data?.name_tc || '未知', lat: parseFloat(sRes.data?.lat), lng: parseFloat(sRes.data?.long) };
            stopCache.set('K_' + s.stop, obj);
            return { seq: s.seq, stopId: s.stop, ...obj };
          }));
        } else if (currentCompany === 'CTB') {
          const res = await fetch(`${API_CTB_ROUTE_STOP}/${currentRoute}/${currentDir}`).then(r => r.json());
          const stopsData = res.data || [];
          stopList = await Promise.all(stopsData.map(async (s) => {
            if (stopCache.has('C_' + s.stop)) return { seq: s.seq, stopId: s.stop, ...stopCache.get('C_' + s.stop) };
            const sRes = await fetch(`${API_CTB_STOP}${s.stop}`).then(r => r.json());
            const obj = { name: sRes.data?.name_tc || '未知', lat: parseFloat(sRes.data?.lat), lng: parseFloat(sRes.data?.long) };
            stopCache.set('C_' + s.stop, obj);
            return { seq: s.seq, stopId: s.stop, ...obj };
          }));
        }

        if (pos) {
          stopList = stopList.map(s => ({
            ...s,
            dist: getDistance(pos.lat, pos.lng, s.lat, s.lng)
          })).sort((a, b) => a.dist - b.dist);
          statusBar.textContent = `🎯 路線 ${currentRoute} (${currentCompany})：最近 3 個車站`;
        } else {
          statusBar.textContent = `⚠️ 未獲取 GPS 定位，顯示前 3 個車站`;
        }

        activeStopsToFetch = stopList.slice(0, 3);
        renderNearbyStops(activeStopsToFetch);
        refreshETAsOnly();

      } catch (e) {
        statusBar.textContent = '❌ 車站數據拉取失敗';
        results.innerHTML = '';
      }
    }

    function renderNearbyStops(stops) {
      results.innerHTML = '';
      stops.forEach(stop => {
        const card = document.createElement('div');
        card.className = 'bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-1.5">
              <span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-bold">第 ${stop.seq} 站</span>
              <h3 class="text-base font-black text-slate-800 tracking-tight">${stop.name}</h3>
            </div>
            ${stop.dist !== undefined ? `<span class="bg-blue-50 text-blue-600 font-black px-2 py-0.5 rounded-lg text-xs tracking-tight">約 ${Math.round(stop.dist)}m</span>` : ''}
          </div>
          <div id="eta-box-${stop.stopId}" class="text-sm space-y-1.5 pt-2 border-t border-slate-100">
            <span class="text-xs text-slate-400">更新班次中...</span>
          </div>
        `;
        results.appendChild(card);
      });
    }

    function refreshETAsOnly() {
      if (currentCompany === 'MTR') {
        loadMTRBusStops(currentRoute);
        return;
      }

      activeStopsToFetch.forEach(stop => {
        const etaBox = document.getElementById(`eta-box-${stop.stopId}`);
        if (!etaBox) return;

        if (currentCompany === 'KMB') {
          fetch(`${API_KMB_ETA}/${stop.stopId}/${currentRoute}/1`)
            .then(r => r.json())
            .then(json => {
              const etas = (json.data || []).filter(item => item.route === currentRoute);
              renderETARows(etaBox, etas);
            }).catch(() => { etaBox.innerHTML = '<span class="text-xs text-red-400">無法獲取 ETA</span>'; });

        } else if (currentCompany === 'CTB') {
          fetch(`${API_CTB_ETA}/${stop.stopId}/${currentRoute}`)
            .then(r => r.json())
            .then(json => {
              const etas = (json.data || []).filter(item => item.dir === (currentDir === 'outbound' ? 'O' : 'I'));
              renderETARows(etaBox, etas);
            }).catch(() => { etaBox.innerHTML = '<span class="text-xs text-red-400">無法獲取 ETA</span>'; });
        }
      });
    }

    function renderETARows(container, etas) {
      if (!etas.length) {
        container.innerHTML = '<span class="text-xs text-slate-400">暫無班次數據</span>';
        return;
      }
      container.innerHTML = etas.slice(0, 3).map((item, idx) => {
        if (!item.eta) return `<div class="text-xs text-slate-400">第 ${idx + 1} 班: 尾班車已過或未開出</div>`;
        const diffMin = Math.round((new Date(item.eta) - new Date()) / 60000);
        const label = diffMin <= 0 ? '即將抵達' : `${diffMin} 分鐘`;
        const isUrgent = diffMin <= 3;
        return `
          <div class="flex justify-between items-center text-xs py-0.5">
            <span class="text-slate-600 truncate max-w-[200px]">往 ${item.dest_tc}</span>
            <span class="px-2 py-0.5 rounded font-black shrink-0 ${isUrgent ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-100 text-slate-800'}">${label}</span>
          </div>
        `;
      }).join('');
    }

    function startAutoRefresh() {
      clearInterval(refreshInterval);
      countdownSec = 30;
      refreshBadge.classList.remove('hidden');
      timerSec.textContent = countdownSec;

      refreshInterval = setInterval(() => {
        countdownSec--;
        timerSec.textContent = countdownSec;
        if (countdownSec <= 0) {
          countdownSec = 30;
          refreshETAsOnly();
        }
      }, 1000);
    }

    btnSearch.onclick = searchRoute;
    routeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchRoute();
    });

    initCatalog();
    loadHistory();
  </script>
</body>
</html>
